<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sa Bàn Chiến Thuật Bang Hội - Full Features</title>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Thư viện html2canvas để chụp xuất file ảnh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f141d;
            --sidebar-bg: #161d2a;
            --accent-gold: #d4af37;
            --accent-red: #ff4d4d;
            --accent-blue: #4d94ff;
            --accent-green: #2ecc71;
            --text-color: #e0e6ed;
            --border-color: #2a3548;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR BÊN TRÁI */
        .sidebar {
            width: 320px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            font-size: 16px;
            color: var(--accent-gold);
            text-transform: uppercase;
        }

        /* CHẾ ĐỘ CÔNG CỤ VẼ MŨI TÊN */
        .draw-mode-box {
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-draw-btn {
            background: #2b384e;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .toggle-draw-btn.active {
            background: var(--accent-gold);
            color: #000;
        }

        /* FORM THÊM ICON */
        .add-icon-form {
            padding: 15px;
            background: rgba(0,0,0,0.15);
            border-bottom: 1px solid var(--border-color);
        }

        .form-title {
            font-size: 11px;
            text-transform: uppercase;
            color: #8899a6;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .form-input, .form-select {
            background: #0f141d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .form-input { flex-grow: 1; }

        .btn-add-icon {
            width: 100%;
            background: #27ae60;
            border: none;
            color: white;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }

        .btn-add-icon:hover { background: #219150; }

        /* DANH SÁCH ICON */
        .icon-section {
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .draggable-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: grab;
            margin-bottom: 8px;
        }

        .draggable-item:hover {
            border-color: var(--accent-gold);
            background: rgba(212, 175, 55, 0.1);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .btn-icon-action {
            background: none;
            border: none;
            color: #8899a6;
            cursor: pointer;
            font-size: 12px;
        }

        /* KHU VỰC CHÍNH (MAIN CONTAINER) */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-toolbar {
            height: 55px;
            background: var(--sidebar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
        }

        .tool-btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: #222d3d;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 7px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn:hover { background: var(--accent-gold); color: #000; }
        .btn-upload { background: #1e3a5f; border-color: #3b82f6; color: #60a5fa; }
        .btn-export { background: #2e7d32; border-color: #4caf50; color: #a5d6a7; }
        .btn-export:hover { background: #4caf50; color: #000; }
        .btn-danger:hover { background: var(--accent-red); color: #fff; }

        /* MAP VIEWPORT & CANVAS */
        .map-viewport {
            flex-grow: 1;
            position: relative;
            background-color: #0a0d13;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map-canvas {
            position: relative;
            width: 1000px;
            height: 650px;
            background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1200&q=80') center/cover no-repeat;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border: 2px solid var(--border-color);
        }

        /* LAYER VẼ MŨI TÊN (CANVAS OVERLAY) */
        #arrowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* Mặc định cho phép click xuyên qua */
        }

        #arrowCanvas.active {
            pointer-events: auto; /* Kích hoạt nhận thao tác chuột khi bật chế độ vẽ */
            cursor: crosshair;
        }

        /* ICON TRÊN MAP */
        .placed-icon {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: move;
            z-index: 20;
        }

        .placed-icon i {
            font-size: 26px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .placed-icon span {
            font-size: 11px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 3px;
            white-space: nowrap;
            margin-top: 2px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>SA BÀN CHIẾN THUẬT</h2>
        </div>

        <!-- CÔNG CỤ VẼ MŨI TÊN -->
        <div class="draw-mode-box">
            <span style="font-size: 12px;">Chế độ Vẽ Đường Đi:</span>
            <button id="drawToggleBtn" class="toggle-draw-btn" onclick="toggleDrawMode()">
                <i class="fa-solid fa-pen-nib"></i> BẮT ĐẦU VẼ
            </button>
        </div>

        <!-- FORM TẠO ICON -->
        <div class="add-icon-form">
            <div class="form-title">Tạo Icon Mới</div>
            <div class="form-group">
                <input type="text" id="newIconName" class="form-input" placeholder="Tên Icon (VD: Đội 1)">
                <select id="newIconColor" class="form-select">
                    <option value="#4d94ff">Màu Xanh</option>
                    <option value="#ff4d4d">Màu Đỏ</option>
                    <option value="#d4af37">Màu Vàng</option>
                    <option value="#2ecc71">Màu Lục</option>
                    <option value="#a855f7">Màu Tím</option>
                </select>
            </div>
            <div class="form-group">
                <select id="newIconSymbol" class="form-select" style="width: 100%;">
                    <option value="fa-shield-halved">🛡️ Khiên (Đội Thủ)</option>
                    <option value="fa-crosshairs">🎯 Tâm ngắm (Đội Công)</option>
                    <option value="fa-skull">💀 Đầu lâu (Quái / Địch)</option>
                    <option value="fa-chess-rook">🏰 Tháp / Thành</option>
                    <option value="fa-flag">🚩 Cờ / Điểm Dừng</option>
                    <option value="fa-location-dot">📍 Điểm Tập Hợp</option>
                    <option value="fa-horse">🐎 Kỵ Binh / Tốc Độ</option>
                </select>
            </div>
            <button class="btn-add-icon" onclick="addNewIconToList()"><i class="fa-solid fa-plus"></i> THÊM VÀO DANH SÁCH</button>
        </div>

        <!-- DANH SÁCH ICON KÉO THẢ -->
        <div class="icon-section">
            <div class="form-title">Danh Sách Icon Kéo Thả</div>
            <div id="iconContainer"></div>
        </div>
    </div>

    <!-- KHU VỰC BẢN ĐỒ CHÍNH -->
    <div class="main-container">
        <!-- TOOLBAR TRÊN CÙNG -->
        <div class="top-toolbar">
            <div class="tool-btn-group">
                <button class="btn btn-upload" onclick="document.getElementById('mapFileInput').click()">
                    <i class="fa-solid fa-file-image"></i> Úp Bản Đồ Mới
                </button>
                <input type="file" id="mapFileInput" accept="image/*" style="display: none;" onchange="uploadMapImage(event)">

                <!-- NÚT XUẤT BẢN ĐỒ THÀNH FILE ẢNH -->
                <button class="btn btn-export" onclick="exportMapToImage()">
                    <i class="fa-solid fa-download"></i> Tải Ảnh Sa Bàn (PNG)
                </button>
            </div>

            <div class="tool-btn-group">
                <button class="btn" onclick="clearArrows()"><i class="fa-solid fa-eraser"></i> Xóa Mũi Tên</button>
                <button class="btn btn-danger" onclick="clearMap()"><i class="fa-solid fa-trash"></i> Xóa Tất Cả</button>
            </div>
        </div>

        <!-- CONTAINER MAP -->
        <div class="map-viewport">
            <div class="map-canvas" id="mapCanvas">
                <!-- Canvas phủ lên để vẽ mũi tên -->
                <canvas id="arrowCanvas" width="1000" height="650"></canvas>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ -->
    <script>
        let iconList = [
            { id: 1, name: "Đội Thủ", symbol: "fa-shield-halved", color: "#4d94ff" },
            { id: 2, name: "Đội Công", symbol: "fa-crosshairs", color: "#ff4d4d" },
            { id: 3, name: "Mục Tiêu Cờ", symbol: "fa-flag", color: "#d4af37" }
        ];

        const iconContainer = document.getElementById('iconContainer');
        const mapCanvas = document.getElementById('mapCanvas');
        const arrowCanvas = document.getElementById('arrowCanvas');
        const ctx = arrowCanvas.getContext('2d');

        let draggedData = null;
        let isDrawingMode = false;
        let isDrawing = false;
        let startX = 0, startY = 0;
        let arrows = []; // Lưu danh sách các mũi tên đã vẽ

        // 1. HIỂN THỊ DANH SÁCH ICON
        function renderIconList() {
            iconContainer.innerHTML = '';
            iconList.forEach(item => {
                const el = document.createElement('div');
                el.className = 'draggable-item';
                el.setAttribute('draggable', 'true');
                el.innerHTML = `
                    <div class="item-info">
                        <i class="fa-solid ${item.symbol}" style="color: ${item.color};"></i>
                        <span>${item.name}</span>
                    </div>
                    <button class="btn-icon-action" onclick="deleteIcon(${item.id})"><i class="fa-solid fa-trash"></i></button>
                `;

                el.addEventListener('dragstart', () => { draggedData = { ...item }; });
                iconContainer.appendChild(el);
            });
        }

        // 2. TÍNH NĂNG VẼ MŨI TÊN
        function toggleDrawMode() {
            isDrawingMode = !isDrawingMode;
            const btn = document.getElementById('drawToggleBtn');
            if (isDrawingMode) {
                btn.classList.add('active');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> ĐANG VẼ (Bấm để Tắt)';
                arrowCanvas.classList.add('active');
            } else {
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fa-solid fa-pen-nib"></i> BẮT ĐẦU VẼ';
                arrowCanvas.classList.remove('active');
            }
        }

        arrowCanvas.addEventListener('mousedown', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            const rect = arrowCanvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        });

        arrowCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            const rect = arrowCanvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            redrawAllCanvas(); // Vẽ lại các mũi tên cũ
            drawArrow(startX, startY, currentX, currentY, '#ff4d4d'); // Vẽ mũi tên đang kéo
        });

        arrowCanvas.addEventListener('mouseup', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            isDrawing = false;
            const rect = arrowCanvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;

            // Lưu mũi tên mới vào danh sách
            arrows.push({ fromX: startX, fromY: startY, toX: endX, toY: endY, color: '#ff4d4d' });
            redrawAllCanvas();
        });

        // Hàm vẽ Mũi tên lên Canvas
        function drawArrow(fromx, fromy, tox, toy, color) {
            const headlen = 12; // Độ dài đầu mũi tên
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 3;

            // Vẽ thân mũi tên
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();

            // Vẽ đầu mũi tên
            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
        }

        function redrawAllCanvas() {
            ctx.clearRect(0, 0, arrowCanvas.width, arrowCanvas.height);
            arrows.forEach(arr => drawArrow(arr.fromX, arr.fromY, arr.toX, arr.toY, arr.color));
        }

        function clearArrows() {
            arrows = [];
            redrawAllCanvas();
        }

        // 3. TÍNH NĂNG XUẤT BẢN ĐỒ RA FILE ẢNH PNG
        function exportMapToImage() {
            // Tắt chế độ vẽ nếu đang bật
            if (isDrawingMode) toggleDrawMode();

            alert('Đang tạo ảnh sơ đồ chiến thuật, vui lòng chờ trong giây lát...');
            
            html2canvas(mapCanvas, {
                useCORS: true,
                scale: 2 // Tăng chất lượng ảnh sắc nét
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'So-Do-Chien-Thuat-Bang.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // 4. KÉO THẢ ICON & UPLOAD ẢNH
        mapCanvas.addEventListener('dragover', (e) => e.preventDefault());
        mapCanvas.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!draggedData) return;
            const rect = mapCanvas.getBoundingClientRect();
            createIconOnMap(draggedData.name, draggedData.symbol, draggedData.color, e.clientX - rect.left, e.clientY - rect.top);
            draggedData = null;
        });

        function createIconOnMap(name, symbol, color, x, y) {
            const el = document.createElement('div');
            el.className = 'placed-icon';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.innerHTML = `<i class="fa-solid ${symbol}" style="color: ${color};"></i><span>${name}</span>`;

            el.querySelector('span').addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const renamed = prompt("Nhập tên mới:", el.querySelector('span').innerText);
                if (renamed) el.querySelector('span').innerText = renamed;
            });

            el.querySelector('i').addEventListener('dblclick', (e) => {
                e.stopPropagation();
                el.remove();
            });

            makeElementDraggable(el);
            mapCanvas.appendChild(el);
        }

        function makeElementDraggable(element) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            element.onmousedown = (e) => {
                if (e.target.tagName === 'SPAN' || isDrawingMode) return;
                e.preventDefault();
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    e.preventDefault();
                    pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                    pos3 = e.clientX; pos4 = e.clientY;
                    element.style.top = (element.offsetTop - pos2) + "px";
                    element.style.left = (element.offsetLeft - pos1) + "px";
                };
            };
        }

        function uploadMapImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => mapCanvas.style.backgroundImage = `url('${e.target.result}')`;
                reader.readAsDataURL(file);
            }
        }

        function addNewIconToList() {
            const name = document.getElementById('newIconName').value.trim();
            if (!name) return alert("Chưa nhập tên Icon!");
            iconList.push({ id: Date.now(), name, symbol: document.getElementById('newIconSymbol').value, color: document.getElementById('newIconColor').value });
            renderIconList();
            document.getElementById('newIconName').value = '';
        }

        function deleteIcon(id) {
            iconList = iconList.filter(item => item.id !== id);
            renderIconList();
        }

        function clearMap() {
            if(confirm('Xóa toàn bộ icon và mũi tên trên bản đồ?')) {
                document.querySelectorAll('.placed-icon').forEach(el => el.remove());
                clearArrows();
            }
        }

        renderIconList();
    </script>
</body>
</html>
