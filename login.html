<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            width: 320px;
        }
        .login-box h2 {
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
            color: #58a6ff;
            text-transform: uppercase;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #8b949e;
            font-size: 13px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #238636;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2ea043;
        }
        .error {
            color: #f85149;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Đăng Nhập Bang Chiến</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Tài khoản:</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Mật khẩu:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Vào Trang Chủ</button>
            <div id="errorMsg" class="error"></div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            const correctUser = "nhabao";
            const correctPass = "Pk123456*"; // Mật khẩu dạng văn bản thông thường

            // So sánh trực tiếp tài khoản và mật khẩu người dùng nhập
            if (user === correctUser && pass === correctPass) {
                // Đánh dấu đã đăng nhập thành công
                sessionStorage.setItem("isLoggedIn", "true");
                // Chuyển hướng vào trang chính index.html
                window.location.href = "index.html";
            } else {
                document.getElementById('errorMsg').innerText = "Sai tài khoản hoặc mật khẩu!";
            }
        }
    </script>

</body>
</html>
