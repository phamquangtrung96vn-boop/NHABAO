<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #3498db;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .note {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            text-align: center;
            line-height: 1.5;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Đăng Nhập</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tài khoản..." required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu..." required>
            </div>
            <button type="submit" class="btn-submit">Tiếp Tục</button>
        </form>
        <div class="note">
            <strong>Tài khoản test:</strong><br>
            - Quản lý: <code>nhabao</code> / <code>Pk123456*</code><br>
            - Thành viên: <code>user</code> / <code>123456</code>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Ngăn load lại trang

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Kiểm tra thông tin tài khoản
            if (username === 'nhabao' && password === 'Pk123456*') {
                // Lưu trạng thái và phân quyền admin
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'admin');

                // Chuyển hướng sang trang trung gian
                window.location.href = 'transit.html';

            } else if (username === 'user' && password === '123456') {
                // Lưu trạng thái và phân quyền user thường
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userRole', 'user');

                // Chuyển hướng sang trang trung gian
                window.location.href = 'transit.html';

            } else {
                alert('Tên đăng nhập hoặc mật khẩu không đúng!');
            }
        });
    </script>

</body>
</html>
