<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Bang Chiến - Dragon's Legacy</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0c10;
            /* Thay đổi hình nền mới sáng sủa và hợp tông xanh rồng hơn */
            background-image: linear-gradient(rgba(5, 10, 8, 0.65), rgba(5, 10, 8, 0.85)), 
                              url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            position: relative;
            width: 380px;
            margin-top: 50px;
        }

        /* Khung tròn chứa hình ảnh rồng */
        .badge-image-container {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #0f1115;
            border-radius: 50%;
            border: 3px solid #238636;
            box-shadow: 0 0 20px rgba(35, 134, 54, 0.9);
            overflow: hidden;
        }

        .badge-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-box {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px); /* Tạo hiệu ứng kính mờ thời thượng */
            border: 2px solid #238636;
            padding: 60px 30px 30px 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(35, 134, 54, 0.3);
        }

        .login-box h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            text-align: center;
            color: #2ea043;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(46, 160, 67, 0.4);
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #2ea043;
            font-size: 12px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .input-group input:focus {
            border-color: #2ea043;
            box-shadow: 0 0 5px rgba(35, 134, 54, 0.5);
        }

        .extra-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-bottom: 20px;
            color: #8b949e;
        }

        .extra-options label {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #c9d1d9;
        }

        .extra-options input[type="checkbox"] {
            margin-right: 6px;
            accent-color: #238636;
        }

        .extra-options a {
            color: #2ea043;
            text-decoration: none;
        }

        .extra-options a:hover {
            text-decoration: underline;
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: linear-gradient(to bottom, #238636, #196127);
            border: 1px solid #2ea043;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
        }

        button[type="submit"]:hover {
            background: linear-gradient(to bottom, #2ea043, #238636);
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 12px;
            border-top: 1px solid #21262d;
            padding-top: 15px;
        }

        .footer-links a {
            color: #8b949e;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #2ea043;
        }

        .error {
            color: #f85149;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Khung chứa hình rồng xanh -->
        <div class="badge-image-container">
            <img src="dragon.png" alt="Biểu Tượng Rồng Xanh">
        </div>

        <div class="login-box">
            <h2>Đăng Nhập Bang Chiến</h2>
            <div class="subtitle">Dragon's Legacy - Liên Đoàn Nhà Báo</div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label for="username">Tài Khoản / Email</label>
                    <input type="text" id="username" placeholder="Nhập danh tính của bạn..." required>
                </div>
                
                <div class="input-group">
                    <label for="password">Mật Khẩu</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="extra-options">
                    <label>
                        <input type="checkbox" id="remember"> Ghi nhớ tài khoản
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit">Vào Trận Chiến</button>
                <div id="errorMsg" class="error"></div>

                <div class="footer-links">
                    <a href="#">Đăng ký tài khoản</a>
                    <a href="#">Hỗ trợ bang hội</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            const correctUser = "nhabao";
            const correctPass = "Pk123456*";

            if (user === correctUser && pass === correctPass) {
                sessionStorage.setItem("isLoggedIn", "true");
                window.location.href = "index.html";
            } else {
                document.getElementById('errorMsg').innerText = "Sai tài khoản hoặc mật khẩu!";
            }
        }
    </script>

</body>
</html>
