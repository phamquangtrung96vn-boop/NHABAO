<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đang chuyển hướng...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="loader-container">
        <div class="spinner"></div>
        <h3>Đang xác thực phiên làm việc, vui lòng chờ...</h3>
    </div>

    <script>
        // Kiểm tra thông tin đăng nhập từ localStorage hoặc Session
        window.addEventListener('DOMContentLoaded', () => {
            const userRole = localStorage.getItem('userRole') || 'user';
            const isLoggedIn = localStorage.getItem('isLoggedIn');

            if (!isLoggedIn) {
                // Nếu chưa đăng nhập, đá về lại trang login
                window.location.href = 'login_2.html';
                return;
            }

            // Giả lập thời gian chờ nhẹ của trang trung gian (0.8 giây)
            setTimeout(() => {
                if (userRole === 'admin') {
                    window.location.href = 'GA_2.html';
                } else {
                    window.location.href = 'index_2.html';
                }
            }, 800);
        });
    </script>

</body>
</html>
