<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Đội Hình Bang Chiến - Nghịch Thủy Hàn</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --header-bg: #1f242d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 20px;
        }

        .title-banner {
            background: linear-gradient(90deg, #161b22, #21262d);
            color: #f0f6fc;
            padding: 12px 20px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-btns {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-action:hover {
            background: #30363d;
            color: #fff;
        }

        .btn-reset {
            background: #da3633;
            color: #fff;
            border: none;
        }
        .btn-reset:hover { background: #f85149; }

        .layout-container {
            display: grid;
            grid-template-columns: 290px 1fr 310px;
            gap: 20px;
        }

        /* BẢNG NHẬP DANH SÁCH MEMBERS */
        .sidebar-members {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            height: calc(100vh - 110px);
            display: flex;
            flex-direction: column;
        }

        .sidebar-members h3 {
            font-size: 15px;
            color: #58a6ff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
        }

        .input-box input, .input-box select, .input-box textarea {
            padding: 6px 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .btn-add {
            background: #238636;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add:hover { background: #2ea043; }

        .member-list-scroll {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-right: 4px;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        /* ĐỘI HÌNH TRUNG TÂM */
        .main-squads {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .group-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .group-header {
            background: #21262d;
            color: #f0f6fc;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .group-sub-header {
            background: rgba(255,255,255,0.03);
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: #8b949e;
            border-bottom: 1px solid var(--border-color);
        }

        /* BẢNG GRID ĐỘI HÌNH */
        .squad-table {
            width: 100%;
            border-collapse: collapse;
        }

        .squad-table th {
            background: #161b22;
            color: #8b949e;
            padding: 6px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .squad-table td {
            border: 1px solid var(--border-color);
            padding: 3px;
            text-align: center;
            width: 18%;
        }

        .squad-table td.stt {
            width: 4%;
            background: #0d1117;
            color: #6e7681;
            font-size: 12px;
            font-weight: bold;
        }

        /* SELECT CHỌN TÊN THÀNH VIÊN */
        .select-member {
            width: 100%;
            padding: 6px 2px;
            border: none;
            border-radius: 3px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            color: #fff;
            text-align: center;
            background-color: #21262d;
        }

        /* BẢNG MÀU MÔN PHÁI */
        .class-ThietY    { background-color: #4a5568 !important; color: #fff; }
        .class-HuyetHa   { background-color: #9b1c1c !important; color: #fff; }
        .class-ToaiMong  { background-color: #6b21a8 !important; color: #fff; }
        .class-ThanTuang { background-color: #1d4ed8 !important; color: #fff; }
        .class-CuuLinh   { background-color: #831843 !important; color: #fff; }
        .class-ToVan     { background-color: #db2777 !important; color: #fff; }
        .class-LongNgam  { background-color: #d97706 !important; color: #fff; }
        .class-TrieuQuang{ background-color: #0284c7 !important; color: #fff; }
        .class-Khac      { background-color: #374151 !important; color: #fff; }

        /* CỘT BÊN PHẢI (DỰ BỊ & GHI CHÚ) */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sub-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }

        .sub-box h4 {
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .sub-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sub-table td {
            padding: 3px;
            border: 1px solid var(--border-color);
        }

        /* PHẦN GHI CHÚ */
        .note-box {
            background: #161b22;
            border: 1px dashed #388bfd;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #58a6ff;
            line-height: 1.5;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .note-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(255,255,255,0.03);
            padding: 5px 8px;
            border-radius: 4px;
        }

        .note-item span {
            color: #c9d1d9;
            word-break: break-word;
        }

        .btn-del-note {
            color: #f85149;
            cursor: pointer;
            margin-left: 8px;
            font-size: 12px;
            margin-top: 2px;
        }

        .note-input-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .note-input-group input {
            flex-grow: 1;
            padding: 5px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .btn-add-note {
            background: #238636;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- BANNER TIÊU ĐỀ VA THANH CÔNG CỤ -->
    <div class="title-banner">
        <span><i class="fa-solid fa-shield-halved"></i> ĐỘI HÌNH BANG CHIẾN - NGHỊCH THỦY HÀN</span>
        <div class="toolbar-btns">
            <button class="btn-action" onclick="exportData()"><i class="fa-solid fa-download"></i> Xuất File</button>
            <button class="btn-action" onclick="document.getElementById('importFileInput').click()"><i class="fa-solid fa-upload"></i> Nhập File</button>
            <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importData(event)">
            <button class="btn-action btn-reset" onclick="resetAllData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>
    </div>

    <div class="layout-container">
        
        <!-- CỘT BÊN TRÁI: DANH SÁCH TỔNG MEMBERS -->
        <div class="sidebar-members">
            <h3 id="memberCountTitle">Danh Sách Bang (0)</h3>
            
            <div class="input-box">
                <input type="text" id="memberNameInput" placeholder="Tên Ingame (VD: VixKings)">
                
                <select id="memberClassInput">
                    <option value="ThietY">🛡️ Thiết Y (Tanker)</option>
                    <option value="HuyetHa">💥 Huyết Hà (Thương / Đấu Sĩ)</option>
                    <option value="ToaiMong">⚡ Toái Mộng (Đoản Đao / Sát Thủ)</option>
                    <option value="ThanTuang">🪕 Thần Tương (Cổ Cầm / Băng Hỏa)</option>
                    <option value="CuuLinh">🔮 Cửu Linh (Phù Trượng / Triệu Hồi)</option>
                    <option value="ToVan">🪭 Tố Vấn (Dải Lụa / Buff Máu)</option>
                    <option value="LongNgam">🗡️ Long Ngâm (Trường Kiếm / Cận Chiến)</option>
                    <option value="TrieuQuang">🌊 Triều Quang (Song Kiếm / Thủy)</option>
                    <option value="Khac">⚔️ Khác</option>
                </select>
                
                <button class="btn-add" onclick="addMember()"><i class="fa-solid fa-plus"></i> Thêm Thành Viên</button>
            </div>

            <div class="member-list-scroll" id="memberListScroll">
                <!-- Render danh sách -->
            </div>
        </div>

        <!-- KHU VỰC GIỮA: ĐOÀN 1 & ĐOÀN 2 -->
        <div class="main-squads">

            <!-- ĐOÀN 1 - THỦ -->
            <div class="group-box">
                <div class="group-header">ĐOÀN 1 - THỦ (Chỉ Huy: Đạo Đạo)</div>
                <div class="group-sub-header">PT 1, 2, 3 đánh đoàn lớn | PT 4, 5 cơ động</div>
                <table class="squad-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>PT1</th>
                            <th>PT2</th>
                            <th>PT3</th>
                            <th>PT4</th>
                            <th>PT5</th>
                        </tr>
                    </thead>
                    <tbody id="group1Body">
                        <!-- Render 6 hàng -->
                    </tbody>
                </table>
            </div>

            <!-- ĐOÀN 2 - CÔNG -->
            <div class="group-box">
                <div class="group-header">ĐOÀN 2 - CÔNG (Chỉ Huy: Minh Sói Trần)</div>
                <div class="group-sub-header">Huyết Hà / Thiết Y lead phụ PT 4, 5</div>
                <table class="squad-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>PT1</th>
                            <th>PT2</th>
                            <th>PT3</th>
                            <th>PT4</th>
                            <th>PT5</th>
                        </tr>
                    </thead>
                    <tbody id="group2Body">
                        <!-- Render 6 hàng -->
                    </tbody>
                </table>
            </div>

        </div>

        <!-- CỘT BÊN PHẢI: DỰ BỊ & GHI CHÚ -->
        <div class="sidebar-right">
            
            <div class="sub-box">
                <h4>DỰ BỊ BANG CHIẾN</h4>
                <table class="sub-table">
                    <tbody id="reserveBody">
                        <!-- Hàng dự bị -->
                    </tbody>
                </table>
            </div>

            <!-- KHU VỰC GHI CHÚ -->
            <div class="note-box">
                <div class="note-header">
                    <strong><i class="fa-solid fa-triangle-exclamation"></i> GHI CHÚ NHIỆM VỤ</strong>
                </div>
                
                <ul class="note-list" id="noteListContainer">
                    <!-- Các ghi chú -->
                </ul>

                <div class="note-input-group">
                    <input type="text" id="newNoteInput" placeholder="Nhập ghi chú mới...">
                    <button class="btn-add-note" onclick="addNote()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

        </div>

    </div>

    <!-- JAVASCRIPT HỆ THỐNG LƯU TRỮ TRẠNG THÁI -->
    <script>
        const classIcons = {
            ThietY: "fa-shield-halved",
            HuyetHa: "fa-burst",
            ToaiMong: "fa-bolt",
            ThanTuang: "fa-music",
            CuuLinh: "fa-wand-magic-sparkles",
            ToVan: "fa-fan",
            LongNgam: "fa-khanda",
            TrieuQuang: "fa-water",
            Khac: "fa-user"
        };

        const defaultMembers = [
            { name: "Đạo Đạo (31_7)", classType: "ThietY" },
            { name: "VixKings", classType: "ThanTuang" },
            { name: "Cậu Ba Khanh", classType: "HuyetHa" },
            { name: "Moisier", classType: "ToaiMong" },
            { name: "12 09", classType: "LongNgam" },
            { name: "Trần Tracy", classType: "ToVan" },
            { name: "Uhuyen", classType: "CuuLinh" },
            { name: "D A N", classType: "TrieuQuang" },
            { name: "Mạc Trường Cửu", classType: "ToVan" },
            { name: "Bạch Như Vân", classType: "ThanTuang" }
        ];

        const defaultNotes = [
            "Tố Vấn chú ý duy trì Buff Máu toàn PT.",
            "Thiết Y gom quái / gom người để Thần Tương & Cửu Linh dồn sát thương.",
            "Toái Mộng bắt lẻ hàng sau của địch.",
            "AE BẬT DISCORD ĐỂ NGHE CALL CHIẾN THUẬT!"
        ];

        // Lấy dữ liệu đã lưu từ LocalStorage nếu có
        let members = JSON.parse(localStorage.getItem('nth_members')) || defaultMembers;
        let notes = JSON.parse(localStorage.getItem('nth_notes')) || defaultNotes;
        let squadSelections = JSON.parse(localStorage.getItem('nth_squads')) || {};

        // Hàm tự động lưu toàn bộ dữ liệu hiện tại
        function saveData() {
            localStorage.setItem('nth_members', JSON.stringify(members));
            localStorage.setItem('nth_notes', JSON.stringify(notes));
            
            const selects = document.querySelectorAll('.select-member');
            const currentSquads = {};
            selects.forEach(sel => {
                if (sel.value) currentSquads[sel.id] = sel.value;
            });
            localStorage.setItem('nth_squads', JSON.stringify(currentSquads));
        }

        // Khởi tạo bảng trận đấu (Grid)
        function initTables() {
            createSquadRows('group1Body', 'g1');
            createSquadRows('group2Body', 'g2');
            createReserveRows('reserveBody');
        }

        function createSquadRows(containerId, prefix) {
            const tbody = document.getElementById(containerId);
            tbody.innerHTML = '';

            for (let row = 1; row <= 6; row++) {
                const tr = document.createElement('tr');
                
                const tdStt = document.createElement('td');
                tdStt.className = 'stt';
                tdStt.innerText = row;
                tr.appendChild(tdStt);

                for (let col = 1; col <= 5; col++) {
                    const td = document.createElement('td');
                    const id = `${prefix}_r${row}_c${col}`;
                    td.innerHTML = `<select class="select-member" id="${id}" onchange="onSelectChange(this)"></select>`;
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function createReserveRows(containerId) {
            const tbody = document.getElementById(containerId);
            tbody.innerHTML = '';
            for (let row = 1; row <= 4; row++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><select class="select-member" id="res_r${row}_c1" onchange="onSelectChange(this)"></select></td>
                    <td><select class="select-member" id="res_r${row}_c2" onchange="onSelectChange(this)"></select></td>
                `;
                tbody.appendChild(tr);
            }
        }

        // Render danh sách thành viên ở cột trái
        function renderMemberList() {
            const listEl = document.getElementById('memberListScroll');
            listEl.innerHTML = '';

            members.forEach((m, index) => {
                const iconClass = classIcons[m.classType] || 'fa-user';
                const item = document.createElement('div');
                item.className = `member-item class-${m.classType}`;
                item.innerHTML = `
                    <span><i class="fa-solid ${iconClass}"></i> ${m.name}</span>
                    <i class="fa-solid fa-xmark" style="cursor:pointer" onclick="removeMember(${index})"></i>
                `;
                listEl.appendChild(item);
            });

            document.getElementById('memberCountTitle').innerText = `Danh Sách Bang (${members.length})`;
            updateAllDropdowns();
            saveData();
        }

        function addMember() {
            const nameInput = document.getElementById('memberNameInput');
            const classInput = document.getElementById('memberClassInput');
            const val = nameInput.value.trim();

            if (!val) return alert("Vui lòng nhập tên Ingame!");

            if (members.some(m => m.name === val)) {
                return alert("Tên thành viên đã tồn tại trong danh sách!");
            }

            members.push({ name: val, classType: classInput.value });
            nameInput.value = '';
            renderMemberList();
        }

        function removeMember(index) {
            const removedName = members[index].name;
            members.splice(index, 1);
            
            // Nếu người bị xóa đang ở trong sơ đồ, xóa vị trí đó
            const selects = document.querySelectorAll('.select-member');
            selects.forEach(select => {
                if (select.value === removedName) {
                    select.value = "";
                    delete squadSelections[select.id];
                }
            });

            renderMemberList();
        }

        // Cập nhật tùy chọn ở các ô Dropdown
        function updateAllDropdowns() {
            const selects = document.querySelectorAll('.select-member');

            selects.forEach(select => {
                const currentValue = select.value || squadSelections[select.id] || "";

                select.innerHTML = '<option value="">-- Trống --</option>';

                members.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name;
                    opt.innerText = m.name;
                    opt.setAttribute('data-class', m.classType);
                    select.appendChild(opt);
                });

                select.value = currentValue;
                applyColorToSelect(select);
            });
        }

        function applyColorToSelect(selectEl) {
            const selectedName = selectEl.value;
            selectEl.className = 'select-member';

            if (selectedName) {
                const memberObj = members.find(m => m.name === selectedName);
                if (memberObj) {
                    selectEl.classList.add(`class-${memberObj.classType}`);
                }
            }
        }

        function onSelectChange(selectEl) {
            if (selectEl.value) {
                squadSelections[selectEl.id] = selectEl.value;
            } else {
                delete squadSelections[selectEl.id];
            }
            applyColorToSelect(selectEl);
            saveData();
        }

        // Render Ghi chú
        function renderNotes() {
            const container = document.getElementById('noteListContainer');
            container.innerHTML = '';

            notes.forEach((noteText, index) => {
                const li = document.createElement('li');
                li.className = 'note-item';
                li.innerHTML = `
                    <span>• ${noteText}</span>
                    <i class="fa-solid fa-trash btn-del-note" onclick="deleteNote(${index})" title="Xóa"></i>
                `;
                container.appendChild(li);
            });
            saveData();
        }

        function addNote() {
            const input = document.getElementById('newNoteInput');
            const text = input.value.trim();
            if (text) {
                notes.push(text);
                input.value = '';
                renderNotes();
            }
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            renderNotes();
        }

        // Xuất file cấu hình dự phòng (.JSON)
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                members: members,
                notes: notes,
                squads: squadSelections
            }, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `Doihinh_BangChien_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        // Nhập file cấu hình từ máy tính (.JSON)
        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.members && parsed.notes) {
                        members = parsed.members;
                        notes = parsed.notes;
                        squadSelections = parsed.squads || {};
                        renderMemberList();
                        renderNotes();
                        updateAllDropdowns();
                        alert("Nhập dữ liệu thành công!");
                    } else {
                        alert("File không đúng định dạng sơ đồ Bang Chiến!");
                    }
                } catch (err) {
                    alert("Lỗi đọc file JSON!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function resetAllData() {
            if (confirm("Bạn có chắc chắn muốn đặt lại sơ đồ về mặc định? Mọi thay đổi hiện tại sẽ bị xóa.")) {
                localStorage.clear();
                members = [...defaultMembers];
                notes = [...defaultNotes];
                squadSelections = {};
                renderMemberList();
                renderNotes();
            }
        }

        // Phím tắt Enter
        document.getElementById('newNoteInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addNote();
        });
        document.getElementById('memberNameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addMember();
        });

        // Chạy khởi tạo
        initTables();
        renderMemberList();
        renderNotes();
    </script>
</body>
</html>
