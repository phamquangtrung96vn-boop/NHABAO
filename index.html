<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Đội Hình Bang Chiến - Nghịch Thủy Hàn</title>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --header-bg: #1f242d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 20px;
        }

        .title-banner {
            background: linear-gradient(90deg, #161b22, #21262d);
            color: #f0f6fc;
            padding: 12px 20px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toolbar-btns {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-action:hover { background: #30363d; color: #fff; }

        .btn-reset { background: #da3633; color: #fff; border: none; }
        .btn-reset:hover { background: #f85149; }

        .layout-container {
            display: grid;
            grid-template-columns: 290px 1fr 310px;
            gap: 20px;
            transition: grid-template-columns 0.3s ease;
        }

        /* TRẠNG THÁI THU GỌN BẢNG BÊN TRÁI */
        .layout-container.collapsed-left {
            grid-template-columns: 50px 1fr 310px;
        }

        /* SIDEBAR MEMBERS */
        .sidebar-members {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            height: calc(100vh - 110px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .sidebar-members h3 {
            font-size: 15px;
            color: #58a6ff;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-toggle-sidebar {
            background: #21262d;
            color: #58a6ff;
            border: 1px solid var(--border-color);
            width: 28px;
            height: 28px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            flex-shrink: 0;
        }

        .btn-toggle-sidebar:hover {
            background: #30363d;
            color: #fff;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
            transition: opacity 0.2s;
        }

        .input-box input, .input-box select {
            padding: 6px 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .btn-add {
            background: #238636;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-add:hover { background: #2ea043; }

        .member-list-scroll {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
            min-height: 100px;
            border: 2px dashed transparent;
            transition: border 0.2s;
        }

        .member-list-scroll.drag-over {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.05);
        }

        /* STYLE KHI THU GỌN SIDEBAR LEF T */
        .sidebar-members.collapsed {
            padding: 10px 5px;
        }

        .sidebar-members.collapsed h3,
        .sidebar-members.collapsed .input-box {
            display: none;
        }

        .sidebar-members.collapsed .sidebar-header {
            justify-content: center;
            margin-bottom: 15px;
        }

        .sidebar-members.collapsed .member-card {
            justify-content: center;
            padding: 8px 0;
        }

        .sidebar-members.collapsed .member-card .member-name-text,
        .sidebar-members.collapsed .member-card .btn-del-member {
            display: none;
        }

        /* THẺ THÀNH VIÊN (DRAGGABLE) */
        .member-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: grab;
            transition: transform 0.1s, opacity 0.2s;
        }

        .member-card:active {
            cursor: grabbing;
        }

        .member-card.dragging {
            opacity: 0.4;
        }

        .member-card span {
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* MAIN SQUADS & TABLES */
        .main-squads {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .group-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .group-header {
            background: #21262d;
            color: #f0f6fc;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .commander-input {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #58a6ff;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
            width: 150px;
            text-align: center;
        }

        .commander-input:focus {
            border-color: #58a6ff;
            background: #161b22;
        }

        .group-sub-header {
            background: rgba(255,255,255,0.03);
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: #8b949e;
            border-bottom: 1px solid var(--border-color);
        }

        .squad-table {
            width: 100%;
            border-collapse: collapse;
        }

        .squad-table th {
            background: #161b22;
            color: #8b949e;
            padding: 6px;
            font-size: 13px;
            border: 1px solid var(--border-color);
        }

        .squad-table td {
            border: 1px solid var(--border-color);
            padding: 3px;
            text-align: center;
            width: 18%;
            height: 38px;
        }

        .squad-table td.stt {
            width: 4%;
            background: #0d1117;
            color: #6e7681;
            font-size: 12px;
            font-weight: bold;
        }

        /* Ô THẢ TRONG BẢNG */
        .drop-zone {
            width: 100%;
            height: 100%;
            min-height: 32px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed transparent;
            transition: all 0.2s;
        }

        .drop-zone.drag-over {
            border-color: #58a6ff;
            background: rgba(88, 166, 255, 0.15);
        }

        .drop-zone .empty-text {
            color: #484f58;
            font-size: 12px;
            font-weight: bold;
        }

        /* CLASS MÀU MÔN PHÁI */
        .class-ThietY    { background-color: #4a5568 !important; color: #fff; }
        .class-HuyetHa   { background-color: #9b1c1c !important; color: #fff; }
        .class-ToaiMong  { background-color: #6b21a8 !important; color: #fff; }
        .class-ThanTuang { background-color: #1d4ed8 !important; color: #fff; }
        .class-CuuLinh   { background-color: #831843 !important; color: #fff; }
        .class-ToVan     { background-color: #db2777 !important; color: #fff; }
        .class-LongNgam  { background-color: #d97706 !important; color: #fff; }
        .class-HuyenCo   { background-color: #475569 !important; color: #fff; }
        .class-TrieuQuang{ background-color: #0284c7 !important; color: #fff; }
        .class-Khac      { background-color: #374151 !important; color: #fff; }

        /* SIDEBAR RIGHT */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sub-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }

        .sub-box h4 {
            color: #c9d1d9;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .sub-table {
            width: 100%;
            border-collapse: collapse;
        }

        .sub-table td {
            padding: 3px;
            border: 1px solid var(--border-color);
            height: 38px;
        }

        .note-box {
            background: #161b22;
            border: 1px dashed #388bfd;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #58a6ff;
            line-height: 1.5;
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .note-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: rgba(255,255,255,0.03);
            padding: 5px 8px;
            border-radius: 4px;
        }

        .note-item span { color: #c9d1d9; word-break: break-word; }

        .btn-del-note {
            color: #f85149;
            cursor: pointer;
            margin-left: 8px;
            font-size: 12px;
            margin-top: 2px;
        }

        .note-input-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .note-input-group input {
            flex-grow: 1;
            padding: 5px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .btn-add-note {
            background: #238636;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        /* KHUNG THỐNG KÊ MÔN PHÁI */
        .stats-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
        }

        .stats-box h4 {
            color: #58a6ff;
            font-size: 13px;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .stat-count {
            background: rgba(0, 0, 0, 0.4);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="title-banner">
        <span><i class="fa-solid fa-shield-halved"></i> ĐỘI HÌNH BANG CHIẾN - NGHỊCH THỦY HÀN</span>
        <div class="toolbar-btns">
            <button class="btn-action" onclick="exportData()"><i class="fa-solid fa-download"></i> Xuất File</button>
            <button class="btn-action" onclick="document.getElementById('importFileInput').click()"><i class="fa-solid fa-upload"></i> Nhập File</button>
            <input type="file" id="importFileInput" style="display:none" accept=".json" onchange="importData(event)">
            <button class="btn-action btn-reset" onclick="resetAllData()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
        </div>
    </div>

    <div class="layout-container" id="layoutContainer">
        <!-- CỘT BÊN TRÁI -->
        <div class="sidebar-members" id="sidebarMembers">
            <div class="sidebar-header">
                <h3 id="memberCountTitle">Chờ Xếp Đội (0)</h3>
                <button class="btn-toggle-sidebar" onclick="toggleSidebar()" id="toggleSidebarBtn" title="Thu / Mở Sidebar">
                    <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
                </button>
            </div>
            <div class="input-box">
                <input type="text" id="memberNameInput" placeholder="Tên Ingame (VD: VixKings)">
                <select id="memberClassInput">
                    <option value="ThietY">✊ Thiết Y (Nắm đấm)</option>
                    <option value="HuyetHa">🛡️ Huyết Hà (Khiên/Thương)</option>
                    <option value="ToaiMong">🗡️ Toái Mộng (Đao/Kiếm)</option>
                    <option value="ThanTuang">🎸 Thần Tương (Đàn)</option>
                    <option value="ToVan">🎗️ Tố Vấn (Dải lụa)</option>
                    <option value="CuuLinh">💀 Cửu Linh (Sọ)</option>
                    <option value="LongNgam">⚔️ Long Ngâm (Song kiếm)</option>
                    <option value="HuyenCo">⚙️ Huyền Cơ (Cơ quan)</option>
                    <option value="TrieuQuang">💧 Triều Quang (Tộc Sương)</option>
                    <option value="Khac">⚔️ Khác</option>
                </select>
                <button class="btn-add" onclick="addMember()"><i class="fa-solid fa-plus"></i> Thêm Thành Viên</button>
            </div>
            <!-- VÙNG THẢ ĐỂ TRẢ VỀ CHỜ XẾP -->
            <div class="member-list-scroll" id="memberListScroll" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDropToUnassigned(event)"></div>
        </div>

        <!-- BẢNG GIỮA -->
        <div class="main-squads">
            <div class="group-box">
                <div class="group-header">
                    <span>ĐOÀN 1 - THỦ (Chỉ Huy:</span>
                    <input type="text" id="commander1Input" class="commander-input" value="Đạo Đạo" oninput="saveData()">
                    <span>)</span>
                </div>
                <div class="group-sub-header">PT 1, 2, 3 đánh đoàn lớn | PT 4, 5 cơ động</div>
                <table class="squad-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>PT1</th><th>PT2</th><th>PT3</th><th>PT4</th><th>PT5</th>
                        </tr>
                    </thead>
                    <tbody id="group1Body"></tbody>
                </table>
            </div>

            <div class="group-box">
                <div class="group-header">
                    <span>ĐOÀN 2 - CÔNG (Chỉ Huy:</span>
                    <input type="text" id="commander2Input" class="commander-input" value="Minh Sói Trần" oninput="saveData()">
                    <span>)</span>
                </div>
                <div class="group-sub-header">Huyết Hà / Thiết Y lead phụ PT 4, 5</div>
                <table class="squad-table">
                    <thead>
                        <tr>
                            <th></th>
                            <th>PT1</th><th>PT2</th><th>PT3</th><th>PT4</th><th>PT5</th>
                        </tr>
                    </thead>
                    <tbody id="group2Body"></tbody>
                </table>
            </div>
        </div>

        <!-- CỘT BÊN PHẢI -->
        <div class="sidebar-right">
            <div class="sub-box">
                <h4>DỰ BỊ BANG CHIẾN</h4>
                <table class="sub-table">
                    <tbody id="reserveBody"></tbody>
                </table>
            </div>

            <div class="note-box">
                <div class="note-header">
                    <strong><i class="fa-solid fa-triangle-exclamation"></i> GHI CHÚ NHIỆM VỤ</strong>
                </div>
                <ul class="note-list" id="noteListContainer"></ul>
                <div class="note-input-group">
                    <input type="text" id="newNoteInput" placeholder="Nhập ghi chú mới...">
                    <button class="btn-add-note" onclick="addNote()"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <!-- KHUNG THỐNG KÊ MÔN PHÁI -->
            <div class="stats-box">
                <h4><i class="fa-solid fa-chart-pie"></i> THỐNG KÊ MÔN PHÁI</h4>
                <div class="stats-grid" id="statsGridContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const classNames = {
            ThietY: "Thiết Y",
            HuyetHa: "Huyết Hà",
            ToaiMong: "Toái Mộng",
            ThanTuang: "Thần Tương",
            ToVan: "Tố Vấn",
            CuuLinh: "Cửu Linh",
            LongNgam: "Long Ngâm",
            HuyenCo: "Huyền Cơ",
            TrieuQuang: "Triều Quang",
            Khac: "Khác"
        };

        const classIcons = {
            ThietY: "fa-hand-fist",
            HuyetHa: "fa-shield-halved",
            ToaiMong: "fa-khanda",
            ThanTuang: "fa-guitar",
            ToVan: "fa-ribbon",
            CuuLinh: "fa-skull",
            LongNgam: "fa-cross-swords",
            HuyenCo: "fa-gear",
            TrieuQuang: "fa-droplet",
            Khac: "fa-user"
        };

        // Thứ tự sắp xếp ưu tiên cho danh sách môn phái
        const classOrder = [
            "ThietY", "HuyetHa", "ToaiMong", "ThanTuang", 
            "ToVan", "CuuLinh", "LongNgam", "HuyenCo", "TrieuQuang", "Khac"
        ];

        const defaultMembers = [
            { name: "Đạo Đạo (31_7)", classType: "ThietY" },
            { name: "VixKings", classType: "ThanTuang" },
            { name: "Cậu Ba Khanh", classType: "HuyetHa" },
            { name: "Moisier", classType: "ToaiMong" },
            { name: "12 09", classType: "LongNgam" },
            { name: "Trần Tracy", classType: "ToVan" },
            { name: "Uhuyen", classType: "CuuLinh" },
            { name: "D A N", classType: "TrieuQuang" },
            { name: "Mạc Trường Cửu", classType: "ToVan" },
            { name: "Bạch Như Vân", classType: "HuyenCo" }
        ];

        const defaultNotes = [
            "Tố Vấn chú ý duy trì Buff Máu toàn PT.",
            "Thiết Y gom quái / gom người để Thần Tương & Cửu Linh dồn sát thương.",
            "Toái Mộng bắt lẻ hàng sau của địch.",
            "AE BẬT DISCORD ĐỂ NGHE CALL CHIẾN THUẬT!"
        ];

        let members = JSON.parse(localStorage.getItem('nth_members')) || defaultMembers;
        let notes = JSON.parse(localStorage.getItem('nth_notes')) || defaultNotes;
        let squadSelections = JSON.parse(localStorage.getItem('nth_squads')) || {};
        let commanders = JSON.parse(localStorage.getItem('nth_commanders')) || { c1: "Đạo Đạo", c2: "Minh Sói Trần" };
        let draggedMemberName = null;

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebarMembers');
            const layout = document.getElementById('layoutContainer');
            const icon = document.getElementById('toggleIcon');

            sidebar.classList.toggle('collapsed');
            layout.classList.toggle('collapsed-left');

            if (sidebar.classList.contains('collapsed')) {
                icon.className = 'fa-solid fa-chevron-right';
            } else {
                icon.className = 'fa-solid fa-chevron-left';
            }
        }

        function saveData() {
            commanders.c1 = document.getElementById('commander1Input').value;
            commanders.c2 = document.getElementById('commander2Input').value;

            localStorage.setItem('nth_members', JSON.stringify(members));
            localStorage.setItem('nth_notes', JSON.stringify(notes));
            localStorage.setItem('nth_squads', JSON.stringify(squadSelections));
            localStorage.setItem('nth_commanders', JSON.stringify(commanders));
        }

        function loadCommanders() {
            document.getElementById('commander1Input').value = commanders.c1 || "Đạo Đạo";
            document.getElementById('commander2Input').value = commanders.c2 || "Minh Sói Trần";
        }

        function initTables() {
            createSquadRows('group1Body', 'g1');
            createSquadRows('group2Body', 'g2');
            createReserveRows('reserveBody');
        }

        function createSquadRows(containerId, prefix) {
            const tbody = document.getElementById(containerId);
            tbody.innerHTML = '';
            for (let row = 1; row <= 6; row++) {
                const tr = document.createElement('tr');
                const tdStt = document.createElement('td');
                tdStt.className = 'stt';
                tdStt.innerText = row;
                tr.appendChild(tdStt);

                for (let col = 1; col <= 5; col++) {
                    const td = document.createElement('td');
                    const slotId = `${prefix}_r${row}_c${col}`;
                    td.innerHTML = `
                        <div class="drop-zone" id="zone_${slotId}" 
                             ondragover="handleDragOver(event)" 
                             ondragleave="handleDragLeave(event)" 
                             ondrop="handleDropSlot(event, '${slotId}')">
                        </div>`;
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
        }

        function createReserveRows(containerId) {
            const tbody = document.getElementById(containerId);
            tbody.innerHTML = '';
            for (let row = 1; row <= 4; row++) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="drop-zone" id="zone_res_r${row}_c1" 
                             ondragover="handleDragOver(event)" 
                             ondragleave="handleDragLeave(event)" 
                             ondrop="handleDropSlot(event, 'res_r${row}_c1')">
                        </div>
                    </td>
                    <td>
                        <div class="drop-zone" id="zone_res_r${row}_c2" 
                             ondragover="handleDragOver(event)" 
                             ondragleave="handleDragLeave(event)" 
                             ondrop="handleDropSlot(event, 'res_r${row}_c2')">
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        }

        /* DRAG & DROP LOGIC */
        function handleDragStart(e, memberName) {
            draggedMemberName = memberName;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', memberName);
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            draggedMemberName = null;
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDropSlot(e, slotId) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (!draggedMemberName) return;

            for (const key in squadSelections) {
                if (squadSelections[key] === draggedMemberName) {
                    delete squadSelections[key];
                }
            }

            squadSelections[slotId] = draggedMemberName;
            renderAll();
        }

        function handleDropToUnassigned(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            if (!draggedMemberName) return;

            for (const key in squadSelections) {
                if (squadSelections[key] === draggedMemberName) {
                    delete squadSelections[key];
                }
            }
            renderAll();
        }

        function removeFromSlot(slotId) {
            delete squadSelections[slotId];
            renderAll();
        }

        function getAssignedMemberNames() {
            return Object.values(squadSelections);
        }

        function renderAll() {
            renderUnassignedList();
            renderSlots();
            renderClassStats();
            saveData();
        }

        function renderUnassignedList() {
            const listEl = document.getElementById('memberListScroll');
            listEl.innerHTML = '';

            const assignedNames = getAssignedMemberNames();
            const unassignedMembers = members.filter(m => !assignedNames.includes(m.name));

            // SẮP XẾP CÁC THÀNH VIÊN CÙNG MÔN PHÁI LẠI GẦN NHAU
            unassignedMembers.sort((a, b) => {
                const indexA = classOrder.indexOf(a.classType) !== -1 ? classOrder.indexOf(a.classType) : 999;
                const indexB = classOrder.indexOf(b.classType) !== -1 ? classOrder.indexOf(b.classType) : 999;
                if (indexA !== indexB) {
                    return indexA - indexB;
                }
                return a.name.localeCompare(b.name);
            });

            unassignedMembers.forEach((m) => {
                const iconClass = classIcons[m.classType] || 'fa-user';
                const card = document.createElement('div');
                card.className = `member-card class-${m.classType}`;
                card.draggable = true;
                card.title = `${m.name} (${classNames[m.classType]})`;
                card.ondragstart = (e) => handleDragStart(e, m.name);
                card.ondragend = handleDragEnd;
                card.innerHTML = `
                    <span><i class="fa-solid ${iconClass}"></i> <span class="member-name-text">${m.name}</span></span>
                    <i class="fa-solid fa-xmark btn-del-member" style="cursor:pointer" title="Xóa hẳn" onclick="removeMemberByName('${m.name}')"></i>
                `;
                listEl.appendChild(card);
            });

            document.getElementById('memberCountTitle').innerText = `Chờ Xếp Đội (${unassignedMembers.length}/${members.length})`;
        }

        function renderSlots() {
            document.querySelectorAll('.drop-zone').forEach(zone => {
                const slotId = zone.id.replace('zone_', '');
                const memberName = squadSelections[slotId];

                if (memberName) {
                    const memberObj = members.find(m => m.name === memberName);
                    if (memberObj) {
                        const iconClass = classIcons[memberObj.classType] || 'fa-user';
                        zone.innerHTML = `
                            <div class="member-card class-${memberObj.classType}" 
                                 draggable="true" 
                                 style="width: 100%; height: 100%;"
                                 ondragstart="handleDragStart(event, '${memberObj.name}')" 
                                 ondragend="handleDragEnd(event)">
                                <span><i class="fa-solid ${iconClass}"></i> ${memberObj.name}</span>
                                <i class="fa-solid fa-xmark" style="cursor:pointer" title="Bỏ khỏi đội" onclick="removeFromSlot('${slotId}')"></i>
                            </div>
                        `;
                    } else {
                        zone.innerHTML = `<span class="empty-text">-- Trống --</span>`;
                    }
                } else {
                    zone.innerHTML = `<span class="empty-text">-- Trống --</span>`;
                }
            });
        }

        /* TÍNH TOÁN VÀ HIỂN THỊ THỐNG KÊ MÔN PHÁI */
        function renderClassStats() {
            const counts = {};
            Object.keys(classIcons).forEach(key => counts[key] = 0);

            members.forEach(m => {
                if (counts[m.classType] !== undefined) {
                    counts[m.classType]++;
                } else {
                    counts.Khac++;
                }
            });

            const container = document.getElementById('statsGridContainer');
            container.innerHTML = '';

            Object.keys(classIcons).forEach(classKey => {
                const item = document.createElement('div');
                item.className = `stat-item class-${classKey}`;
                item.innerHTML = `
                    <span><i class="fa-solid ${classIcons[classKey]}"></i> ${classNames[classKey]}</span>
                    <span class="stat-count">${counts[classKey]}</span>
                `;
                container.appendChild(item);
            });
        }

        function addMember() {
            const nameInput = document.getElementById('memberNameInput');
            const classInput = document.getElementById('memberClassInput');
            const val = nameInput.value.trim();

            if (!val) return alert("Vui lòng nhập tên Ingame!");

            if (members.some(m => m.name === val)) {
                return alert("Tên thành viên đã tồn tại!");
            }

            members.push({ name: val, classType: classInput.value });
            nameInput.value = '';
            renderAll();
        }

        function removeMemberByName(nameToRemove) {
            members = members.filter(m => m.name !== nameToRemove);
            for (const key in squadSelections) {
                if (squadSelections[key] === nameToRemove) {
                    delete squadSelections[key];
                }
            }
            renderAll();
        }

        function renderNotes() {
            const container = document.getElementById('noteListContainer');
            container.innerHTML = '';

            notes.forEach((noteText, index) => {
                const li = document.createElement('li');
                li.className = 'note-item';
                li.innerHTML = `
                    <span>• ${noteText}</span>
                    <i class="fa-solid fa-trash btn-del-note" onclick="deleteNote(${index})" title="Xóa"></i>
                `;
                container.appendChild(li);
            });
            saveData();
        }

        function addNote() {
            const input = document.getElementById('newNoteInput');
            const text = input.value.trim();
            if (text) {
                notes.push(text);
                input.value = '';
                renderNotes();
            }
        }

        function deleteNote(index) {
            notes.splice(index, 1);
            renderNotes();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                members: members,
                notes: notes,
                squads: squadSelections,
                commanders: commanders
            }, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `Doihinh_BangChien_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.members && parsed.notes) {
                        members = parsed.members;
                        notes = parsed.notes;
                        squadSelections = parsed.squads || {};
                        commanders = parsed.commanders || { c1: "Đạo Đạo", c2: "Minh Sói Trần" };
                        loadCommanders();
                        renderAll();
                        renderNotes();
                        alert("Nhập dữ liệu thành công!");
                    } else {
                        alert("File không đúng định dạng!");
                    }
                } catch (err) {
                    alert("Lỗi đọc file JSON!");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function resetAllData() {
            if (confirm("Bạn có chắc chắn muốn đặt lại sơ đồ về mặc định? Mọi thay đổi hiện tại sẽ bị xóa.")) {
                localStorage.clear();
                members = [...defaultMembers];
                notes = [...defaultNotes];
                squadSelections = {};
                commanders = { c1: "Đạo Đạo", c2: "Minh Sói Trần" };
                loadCommanders();
                renderAll();
                renderNotes();
            }
        }

        document.getElementById('newNoteInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addNote();
        });
        document.getElementById('memberNameInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addMember();
        });

        initTables();
        loadCommanders();
        renderAll();
        renderNotes();
    </script>
</body>
</html>
