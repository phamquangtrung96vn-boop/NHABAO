<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị - Dashboard</title>
    <!-- Thêm CSS hoặc Tailwind nếu cần -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
        }
        header {
            background-color: #343a40;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            padding: 20px;
        }
        .btn-logout {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-logout:hover {
            background-color: #c82333;
        }
    </style>

    <!-- KIỂM TRA PHIÊN ĐĂNG NHẬP NGAY KHI TẢI TRANG -->
    <script>
        // Kiểm tra xem trong localStorage có lưu trạng thái đăng nhập hay token không
        // Bạn có thể thay đổi 'isLoggedIn' hoặc 'userToken' thành key thực tế mà trang login.html của bạn đang dùng
        const isLoggedIn = localStorage.getItem('isLoggedIn'); // Hoặc localStorage.getItem('userToken')

        if (!isLoggedIn || isLoggedIn !== 'true') {
            // Nếu chưa đăng nhập, ngay lập tức đá văng về trang login.html
            window.location.replace('login.html');
        }
    </script>
</head>
<body>

    <header>
        <h2>Hệ Thống Quản Trị</h2>
        <div>
            <span id="user-info" style="margin-right: 15px;">Xin chào, Admin</span>
            <button class="btn-logout" onclick="handleLogout()">Đăng Xuất</button>
        </div>
    </header>

    <div class="container">
        <h1>Chào mừng bạn đến với trang quản trị!</h1>
        <p>Nội dung trang quản lý của bạn sẽ được đặt ở đây.</p>
    </div>

    <script>
        // Hàm xử lý đăng xuất
        function handleLogout() {
            // Xóa trạng thái đăng nhập khỏi localStorage
            localStorage.removeItem('isLoggedIn');
            // Hoặc dùng localStorage.clear() nếu muốn xóa toàn bộ

            // Chuyển hướng về trang login
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
