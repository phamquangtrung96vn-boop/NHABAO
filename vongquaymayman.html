<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiếc Nón Kỳ Diệu - Vòng Quay Tên</title>
    <!-- Thư viện hiệu ứng pháo giấy Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Thư viện Supabase để lấy dữ liệu từ GA -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        .setup-screen {
            background: rgba(0, 0, 0, 0.4);
            padding: 25px;
            border-radius: 15px;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            font-size: 15px;
            border-radius: 5px;
            border: none;
            outline: none;
            resize: none;
            margin-bottom: 15px;
        }

        .game-screen {
            display: none;
        }

        /* Bố cục chia giao diện chính: Vòng quay ở giữa, bảng bên phải */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Bảng danh sách trúng thưởng bên phải */
        .winner-board {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ffd700;
            border-radius: 12px;
            width: 320px;
            height: 480px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: left;
            display: flex;
            flex-direction: column;
        }

        .winner-board h3 {
            color: #ffd700;
            margin-top: 0;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .winner-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 5px;
        }

        .winner-list::-webkit-scrollbar {
            width: 6px;
        }
        .winner-list::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.4);
            border-radius: 3px;
        }

        .winner-list li {
            background: rgba(255, 215, 0, 0.15);
            margin-bottom: 8px;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 15px;
            color: #00ffcc;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.5s ease-in-out;
        }

        .winner-list li.latest-winner {
            background: rgba(255, 215, 0, 0.4);
            border: 1px solid #ffd700;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-top: 22px solid #ff4757;
            margin-top: 2px;
            margin-bottom: -10px;
            z-index: 10;
            filter: drop-shadow(0 -2px 2px rgba(0,0,0,0.5));
        }

        .wheel-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 8px solid #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
            overflow: hidden;
            background: #222;
        }

        canvas {
            display: block;
            transition: transform 6s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #ffd700;
            color: #333;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        button:hover {
            background-color: #ffc107;
            transform: scale(1.05);
        }

        button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #238636;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #2ea043;
        }

        .btn-back {
            background-color: #ff4757;
            color: white;
        }
        .btn-back:hover {
            background-color: #ff6b81;
        }

        .setup-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .result-text {
            font-size: 20px;
            margin-top: 15px;
            min-height: 35px;
            color: #00ffcc;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 20px;
            border-radius: 10px;
            display: inline-block;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🎁 VÒNG QUAY MAY MẮN 🎁</h1>

    <!-- MÀN HÌNH NHẬP DANH SÁCH -->
    <div class="setup-screen" id="setupScreen">
        <h3>Nhập danh sách tên của bạn</h3>
        <p style="font-size: 13px; color: #ddd; margin-top: -5px;">Mỗi người một dòng hoặc lấy từ trang GA:</p>
        <textarea id="nameListInput" placeholder="Nguyễn Văn A&#10;Trần Thị B&#10;Lê Văn C&#10;Phạm Thị D">Nguyễn Văn A
Trần Thị B
Lê Văn C
Phạm Thị D</textarea>
        <br>
        <div class="setup-buttons">
            <button class="btn-secondary" onclick="loadListFromGA()"><i class="fa-solid fa-cloud-arrow-down"></i> Lấy DS từ GA</button>
            <button onclick="initGame()">Tạo Vòng Quay</button>
        </div>
    </div>

    <!-- MÀN HÌNH QUAY -->
    <div class="game-screen" id="gameScreen">
        <div class="main-layout">
            <!-- Khu vực vòng quay và điều khiển bên trái -->
            <div class="game-container">
                <div class="pointer"></div>
                <div class="wheel-wrapper">
                    <canvas id="wheelCanvas" width="400" height="400"></canvas>
                </div>
                
                <div class="controls">
                    <button id="spinBtn" onclick="spinWheel()">QUAY NGAY</button>
                    <button class="btn-back" onclick="resetSetup()">Nhập lại từ đầu</button>
                </div>

                <div class="result-text" id="result">Hãy bấm "Quay Ngay" để tìm người may mắn!</div>
            </div>

            <!-- Bảng danh sách trúng thưởng bên phải -->
            <div class="winner-board">
                <h3>🏆 Đã Trúng Thưởng</h3>
                <ul class="winner-list" id="winnerList">
                    <!-- Danh sách hiển thị ở đây -->
                </ul>
            </div>
        </div>
    </div>

    <!-- Thêm FontAwesome icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        let names = [];
        let winners = [];
        let currentRotation = 0;
        let isSpinning = false;
        const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#9b59b6', '#00d2d3', '#ff6b81', '#eccc68'];

        let supabaseClient = null;

        // Khởi tạo Supabase kết nối chung cơ sở dữ liệu
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const SUPABASE_URL = 'https://shblqenkrzjuklzrvoie.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYmxxZW5rcnpqdWtsenJ2b2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4MjMsImV4cCI6MjEwNDU0NjgyM30.I8bsjcbR3dNYm99kHan8mLj9X7jcNuPEzFQTk9jUups';
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch(e) {
                console.log("Lỗi khởi tạo Supabase:", e);
            }
        });

        // Hàm lấy trực tiếp danh sách các trận đấu ở cột bên phải từ trang GA (Tự động lấy buổi mới nhất)
        async function loadListFromGA() {
            if (!supabaseClient) {
                alert("⚠️ Chưa kết nối được tới cơ sở dữ liệu Supabase!");
                return;
            }

            try {
                let { data: gaData, error } = await supabaseClient
                    .from('ga_data')
                    .select('*')
                    .eq('id', 'main_ga_config')
                    .maybeSingle();

                if (error) {
                    alert("❌ Lỗi tải dữ liệu GA: " + error.message);
                    return;
                }

                if (gaData && gaData.content) {
                    const content = gaData.content;
                    const sessions = content.sessions || {};
                    const checkedState = content.checkedState || {};
                    const sessionKeys = Object.keys(sessions);

                    if (sessionKeys.length === 0) {
                        alert("⚠️ Không tìm thấy buổi nào trong dữ liệu GA!");
                        return;
                    }

                    // Tự động trỏ sẵn vào buổi mới nhất (ở cuối danh sách)
                    let targetKey = sessionKeys[sessionKeys.length - 1];
                    
                    let promptMsg = "Danh sách các buổi:\n" + sessionKeys.map((k, idx) => `${idx + 1}. ${k}`).join("\n") + "\n\nNhập tên hoặc số thứ tự buổi bạn muốn lấy:";
                    let choice = prompt(promptMsg, targetKey);
                    if (!choice) return;
                    
                    let trimmed = choice.trim();
                    if (sessionKeys.includes(trimmed)) {
                        targetKey = trimmed;
                    } else {
                        let idx = parseInt(trimmed) - 1;
                        if (!isNaN(idx) && sessionKeys[idx]) {
                            targetKey = sessionKeys[idx];
                        } else {
                            alert("⚠️ Buổi bạn nhập không tồn tại!");
                            return;
                        }
                    }

                    const currentSessionData = sessions[targetKey] || [];
                    let selectedNames = [];

                    // Quét qua toàn bộ danh sách ở cột bên phải và lấy chính xác các dòng được hiển thị
                    currentSessionData.forEach(item => {
                        const memberName = item.name ? item.name.trim() : "";
                        if (memberName) {
                            const memberChecks = checkedState[memberName] || {};
                            const matchType = item.type; // 'scrim1', 'scrim2', 'scrim3', 'bc'
                            
                            if (matchType && memberChecks[matchType]) {
                                selectedNames.push(memberName);
                            }
                        }
                    });

                    if (selectedNames.length === 0) {
                        alert(`⚠️ Không có thành viên nào được tích chọn trong danh sách "${targetKey}"!`);
                        return;
                    }

                    // Điền danh sách vào ô textarea
                    document.getElementById("nameListInput").value = selectedNames.join('\n');
                    alert(`✅ Đã tải thành công ${selectedNames.length} mục từ cột bên phải [${targetKey}] của trang GA vào vòng quay!`);
                } else {
                    alert("⚠️ Chưa có dữ liệu GA được lưu trên Cloud. Hãy bấm 'Lưu Cloud' ở trang quản lý GA trước.");
                }
            } catch (err) {
                alert("❌ Lỗi kết nối lấy dữ liệu GA: " + err.message);
            }
        }

        // --- GIAI ĐIỆU ĐẦY ĐỦ XỔ SỐ KIẾN THIẾT MIỀN BẮC ---
        let audioCtx = null;
        let activeTimeouts = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        const fullLottoMelody = [
            { f: 587.33, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 698.46, d: 0.12 }, { f: 880.00, d: 0.25 },
            { f: 783.99, d: 0.12 }, { f: 698.46, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 587.33, d: 0.25 },
            { f: 523.25, d: 0.12 }, { f: 587.33, d: 0.12 }, { f: 659.25, d: 0.12 }, { f: 698.46, d: 0.25 },
            { f: 587.33, d: 0.12 }, { f: 523.25, d: 0.12 }, { f: 440.00, d: 0.35 },
            { f: 880.00, d: 0.2 }, { f: 783.99, d: 0.12 }, { f: 698.46, d: 0.12 },
            { f: 783.99, d: 0.2 }, { f: 659.25, d: 0.12 }, { f: 587.33, d: 0.12 },
            { f: 659.25, d: 0.2 }, { f: 587.33, d: 0.12 }, { f: 523.25, d: 0.12 },
            { f: 587.33, d: 0.3 }, { f: 440.00, d: 0.4 }
        ];

        function playNote(freq, duration) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function scheduleLoop() {
            if (!isSpinning) return;

            let totalDuration = 0;
            fullLottoMelody.forEach(note => {
                let t = setTimeout(() => {
                    if (isSpinning) {
                        playNote(note.f, note.d);
                    }
                }, totalDuration * 1000);
                activeTimeouts.push(t);
                totalDuration += note.d + 0.02;
            });

            let loopTimer = setTimeout(() => {
                if (isSpinning) {
                    scheduleLoop();
                }
            }, totalDuration * 1000);
            activeTimeouts.push(loopTimer);
        }

        function startFullLottoMusic() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            isSpinning = true;
            stopFullLottoMusic();
            scheduleLoop();
        }

        function stopFullLottoMusic() {
            isSpinning = false;
            activeTimeouts.forEach(t => clearTimeout(t));
            activeTimeouts = [];
        }
        // -------------------------------------------------------------

        function initGame() {
            initAudio();
            const rawText = document.getElementById("nameListInput").value;
            names = rawText.split('\n').map(name => name.trim()).filter(name => name !== "");

            if (names.length < 2) {
                alert("Vui lòng nhập ít nhất từ 2 tên trở lên để quay!");
                return;
            }

            winners = []; 
            updateWinnerBoard();

            document.getElementById("setupScreen").style.display = "none";
            document.getElementById("gameScreen").style.display = "block";
            document.getElementById("result").innerText = 'Hãy bấm "Quay Ngay" để tìm người may mắn!';

            currentRotation = 0;
            document.getElementById("wheelCanvas").style.transform = `rotate(0deg)`;
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (names.length === 0) return;

            const arcSize = (2 * Math.PI) / names.length;

            for (let i = 0; i < names.length; i++) {
                const angle = i * arcSize;

                ctx.beginPath();
                ctx.fillStyle = colors[i % colors.length];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.save();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 14px 'Segoe UI', sans-serif";
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillText(names[i], radius - 20, 5);
                
                ctx.restore();
            }
        }

        function spinWheel() {
            if (isSpinning) return;
            if (names.length === 0) {
                alert("Tất cả mọi người trong danh sách đã trúng thưởng hết rồi!");
                return;
            }

            document.getElementById("spinBtn").disabled = true;
            document.getElementById("result").innerText = "Đang quay... Hồi hộp chờ kết quả!";

            startFullLottoMusic();

            const sliceDegree = 360 / names.length;
            const winningIndex = Math.floor(Math.random() * names.length);
            const winner = names[winningIndex];

            const centerOfSlice = winningIndex * sliceDegree + (sliceDegree / 2);
            const targetDegreeInCircle = (360 - centerOfSlice + 270) % 360;

            const currentMod = currentRotation % 360;
            let extraRotation = targetDegreeInCircle - currentMod;
            if (extraRotation <= 0) {
                extraRotation += 360;
            }

            const totalRounds = 2520; // 6 giây quay
            const totalRotation = currentRotation + totalRounds + extraRotation;
            
            currentRotation = totalRotation;
            const canvas = document.getElementById("wheelCanvas");
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Sau 6 giây: Dừng vòng quay và KÍCH HOẠT HIỆU ỨNG PHÁO GIẤY 🎉
            setTimeout(() => {
                stopFullLottoMusic();
                document.getElementById("result").innerText = `🎉 Chúc mừng: ${winner} đã trúng thưởng! 🎉`;

                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });

                // Sau đúng 3 giây tiếp theo: Xóa khỏi vòng quay và đưa lên bảng
                setTimeout(() => {
                    winners.push(winner);
                    updateWinnerBoard();

                    names.splice(winningIndex, 1);

                    document.getElementById("spinBtn").disabled = false;

                    currentRotation = currentRotation % 360; 
                    canvas.style.transition = 'none'; 
                    canvas.style.transform = `rotate(${currentRotation}deg)`;
                    
                    setTimeout(() => {
                        canvas.style.transition = 'transform 6s cubic-bezier(0.1, 0.7, 0.1, 1)'; 
                    }, 50);

                    drawWheel();

                    if (names.length === 0) {
                        document.getElementById("spinBtn").disabled = true;
                        document.getElementById("result").innerText = "🏁 Đã quay xong toàn bộ danh sách!";
                    } else {
                        document.getElementById("result").innerText = 'Hãy bấm "Quay Ngay" để tiếp tục!';
                    }

                }, 3000);

            }, 6000);
        }

        function updateWinnerBoard() {
            const listEl = document.getElementById("winnerList");
            listEl.innerHTML = "";
            winners.forEach((person, index) => {
                const li = document.createElement("li");
                if (index === winners.length - 1) {
                    li.classList.add("latest-winner");
                }
                li.innerHTML = `⭐ ${index + 1}. ${person}`;
                listEl.appendChild(li);
            });
        }

        function resetSetup() {
            stopFullLottoMusic();
            document.getElementById("gameScreen").style.display = "none";
            document.getElementById("setupScreen").style.display = "inline-block";
            currentRotation = 0;
            document.getElementById("wheelCanvas").style.transform = `rotate(0deg)`;
        }
    </script>
</body>
</html>
