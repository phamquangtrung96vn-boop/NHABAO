<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Sách GA & Thành Viên Bang</title>
    
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 15px;
        }

        /* KHUNG LOGIN OVERLAY */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .login-box h3 {
            color: #58a6ff;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .login-box input {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 14px;
            text-align: center;
        }

        .login-box input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .login-box button {
            width: 100%;
            background: #238636;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .login-box button:hover {
            background: #2ea043;
        }

        .login-error {
            color: #f85149;
            font-size: 12px;
            margin-top: 8px;
            display: none;
        }

        .header-banner {
            background: #161b22;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-back:hover { background: #30363d; color: #fff; }

        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 15px;
            height: calc(100vh - 90px);
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            color: #58a6ff;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .filter-container {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .search-input, .filter-select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-input {
            flex: 1;
        }

        .filter-select {
            width: 140px;
        }

        .search-input:focus, .filter-select:focus { outline: none; border-color: #58a6ff; }

        .member-scroll-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .member-card {
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .member-info-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 120px;
        }

        .member-name {
            font-weight: bold;
            color: #fff;
        }

        .member-class-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
            font-weight: 600;
        }

        .member-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            max-width: 250px;
            justify-content: flex-end;
        }

        .checkbox-group {
            display: flex;
            gap: 4px;
            font-size: 11px;
            align-items: center;
            cursor: pointer;
            color: #c9d1d9;
        }

        .checkbox-group input {
            accent-color: #238636;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .right-toolbar {
            display: flex;
            gap: 8px;
        }

        .btn-mini {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-mini.danger { color: #f85149; border-color: rgba(248,81,73,0.4); }
        .btn-mini:hover { background: #30363d; }

        .history-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-history {
            color: #8b949e;
            font-style: italic;
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
        }

        /* Màu sắc hệ phái chuẩn */
        .class-ThietY    { background-color: #facc15 !important; color: #111; }
        .class-HuyetHa   { background-color: #dc2626 !important; color: #fff; }
        .class-ToaiMong  { background-color: #7dd3fc !important; color: #111; }
        .class-ThanTuang { background-color: #1d4ed8 !important; color: #fff; }
        .class-CuuLinh   { background-color: #831843 !important; color: #fff; }
        .class-ToVan     { background-color: #ec4899 !important; color: #fff; }
        .class-LongNgam  { background-color: #166534 !important; color: #fff; }
        .class-HuyenCo   { background-color: #475569 !important; color: #fff; }
        .class-TrieuQuang{ background-color: #0284c7 !important; color: #fff; }

        .custom-spear-icon {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: middle;
            background-color: currentColor;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 250"><path d="M50 0 L85 45 L70 105 L60 115 L60 215 L70 225 L50 250 L30 225 L40 215 L40 115 L30 105 L15 45 Z M50 20 L35 55 L50 95 L65 55 Z"/></svg>') no-repeat center / contain;
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 250"><path d="M50 0 L85 45 L70 105 L60 115 L60 215 L70 225 L50 250 L30 225 L40 215 L40 115 L30 105 L15 45 Z M50 20 L35 55 L50 95 L65 55 Z"/></svg>') no-repeat center / contain;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP (XÁC MINH MẬT KHẨU) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h3><i class="fa-solid fa-lock"></i> Xác Minh Truy Cập</h3>
            <input type="password" id="loginPasswordInput" placeholder="Nhập mật khẩu quản lý..." onkeydown="if(event.key==='Enter') checkLogin()">
            <button onclick="checkLogin()">Đăng Nhập</button>
            <div id="loginErrorMsg" class="login-error">Mật khẩu không đúng!</div>
        </div>
    </div>

    <div class="header-banner">
        <span><i class="fa-solid fa-users-gear"></i> QUẢN LÝ DANH SÁCH GA & THÀNH VIÊN BANG</span>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Về Sơ Đồ</a>
    </div>

    <div class="main-layout">
        <!-- CỘT TRÁI: THÀNH VIÊN BANG -->
        <div class="panel">
            <div class="panel-title">
                <span id="leftTitle">THÀNH VIÊN BANG ( 0 )</span>
            </div>
            
            <div class="filter-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm tên thành viên..." oninput="filterMembers()">
                <select class="filter-select" id="classFilter" onchange="filterMembers()">
                    <option value="">Tất cả môn phái</option>
                    <option value="ThietY">Thiết Y</option>
                    <option value="HuyetHa">Huyết Hà</option>
                    <option value="ToaiMong">Toái Mộng</option>
                    <option value="ThanTuang">Thần Tương</option>
                    <option value="ToVan">Tố Vấn</option>
                    <option value="CuuLinh">Cửu Linh</option>
                    <option value="LongNgam">Long Ngâm</option>
                    <option value="HuyenCo">Huyền Cơ</option>
                    <option value="TrieuQuang">Triều Quang</option>
                </select>
            </div>

            <div class="member-scroll-list" id="leftMemberList">
                <div class="empty-history">Đang chờ xác minh đăng nhập...</div>
            </div>
        </div>

        <!-- CỘT PHẢI: LỊCH SỬ / TRÚNG THƯỞNG -->
        <div class="panel">
            <div class="panel-title">
                <span id="rightTitle">LỊCH SỬ TRÚNG THƯỞNG ( 0 )</span>
                <div class="right-toolbar">
                    <button class="btn-mini" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
                    <button class="btn-mini danger" onclick="clearHistory()"><i class="fa-solid fa-trash"></i> Xóa Hết</button>
                </div>
            </div>
            <div class="history-content" id="rightHistoryList">
                <div class="empty-history">Chưa có dữ liệu.</div>
            </div>
        </div>
    </div>

    <script>
        const classIcons = {
            ThietY: "fa-solid fa-hand-fist",
            HuyetHa: "custom-spear-icon",
            ToaiMong: "fa-solid fa-burst",
            ThanTuang: "fa-solid fa-guitar",
            ToVan: "fa-solid fa-heart-pulse",
            CuuLinh: "fa-solid fa-skull",
            LongNgam: "fa-solid fa-bolt",
            HuyenCo: "fa-solid fa-gear",
            TrieuQuang: "fa-solid fa-droplet"
        };

        const classNamesMap = {
            ThietY: "Thiết Y",
            HuyetHa: "Huyết Hà",
            ToaiMong: "Toái Mộng",
            ThanTuang: "Thần Tương",
            ToVan: "Tố Vấn",
            CuuLinh: "Cửu Linh",
            LongNgam: "Long Ngâm",
            HuyenCo: "Huyền Cơ",
            TrieuQuang: "Triều Quang"
        };

        function getIconHTML(classType) {
            if (classType === 'HuyetHa') {
                return `<i class="custom-spear-icon"></i>`;
            }
            return `<i class="${classIcons[classType] || 'fa-solid fa-user'}"></i>`;
        }

        let membersList = [];
        let checkedState = {}; 
        let supabaseClient = null;
        let systemPassword = "admin"; // Mật khẩu mặc định (có thể đồng bộ từ Cloud nếu trang Index của bạn dùng chung cấu hình)

        const matchTypes = [
            { key: 'scrim1', label: 'Scrim 1' },
            { key: 'scrim2', label: 'Scrim 2' },
            { key: 'scrim3', label: 'Scrim 3' },
            { key: 'bc', label: 'Bang Chiến' }
        ];

        async function checkLogin() {
            const enteredPass = document.getElementById('loginPasswordInput').value;
            
            // Nếu đã lấy được mật khẩu từ Cloud, ưu tiên dùng mật khẩu đó, nếu chưa thì tạm so sánh với chuỗi mặc định hoặc kiểm tra nhanh trên Supabase
            if (enteredPass === systemPassword || enteredPass === "admin") {
                document.getElementById('loginOverlay').style.display = 'none';
                initApp(); // Sau khi đăng nhập đúng mới bắt đầu tải dữ liệu
            } else {
                document.getElementById('loginErrorMsg').style.display = 'block';
            }
        }

        async function initApp() {
            try {
                const SUPABASE_URL = 'https://shblqenkrzjuklzrvoie.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYmxxZW5rcnpqdWtsenJ2b2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4MjMsImV4cCI6MjEwNDU0NjgyM30.I8bsjcbR3dNYm99kHan8mLj9X7jcNuPEzFQTk9jUups';
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                let { data, error } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'main_config')
                    .maybeSingle();

                if (data && data.content) {
                    if (data.content.password) {
                        systemPassword = data.content.password; // Đồng bộ pass chuẩn từ Index nếu có
                    }
                    if (data.content.members) {
                        membersList = data.content.members.filter(m => m.classType && m.classType !== 'Khac');
                        membersList.sort((a, b) => a.classType.localeCompare(b.classType));
                    }
                    if (data.content.gaCheckedState) {
                        checkedState = data.content.gaCheckedState;
                    }
                }
            } catch (err) {
                console.log("Lỗi đồng bộ cloud:", err);
            }

            renderAll();
        }

        function renderAll() {
            filterMembers();
            renderRightHistory();
        }

        function filterMembers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedClass = document.getElementById('classFilter').value;

            const filtered = membersList.filter(m => {
                const matchName = m.name.toLowerCase().includes(keyword);
                const matchClass = selectedClass === "" || m.classType === selectedClass;
                return matchName && matchClass;
            });

            renderLeftList(filtered);
        }

        function renderLeftList(list) {
            const container = document.getElementById('leftMemberList');
            container.innerHTML = '';
            document.getElementById('leftTitle').innerText = `THÀNH VIÊN BANG ( ${list.length} )`;

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="empty-history">Không tìm thấy thành viên phù hợp.</div>';
                return;
            }

            list.forEach(m => {
                const classType = m.classType;
                const name = m.name;
                if (!checkedState[name]) checkedState[name] = {};

                let checkboxesHTML = '';
                matchTypes.forEach(type => {
                    const isChecked = !!checkedState[name][type.key];
                    checkboxesHTML += `
                        <label class="checkbox-group">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleScrim('${name}', '${type.key}', this.checked)"> ${type.label}
                        </label>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <div class="member-info-left">
                        <span class="member-name">${name}</span>
                        <span class="member-class-tag class-${classType}">
                            ${getIconHTML(classType)} ${classNamesMap[classType]}
                        </span>
                    </div>
                    <div class="member-actions">
                        ${checkboxesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleScrim(name, scrimType, isChecked) {
            if (!checkedState[name]) {
                checkedState[name] = {};
            }
            checkedState[name][scrimType] = isChecked;
            
            renderRightHistory();

            if (supabaseClient) {
                try {
                    let { data } = await supabaseClient
                        .from('squad_data')
                        .select('*')
                        .eq('id', 'main_config')
                        .maybeSingle();

                    let currentContent = data && data.content ? data.content : {};
                    currentContent.gaCheckedState = checkedState;

                    await supabaseClient
                        .from('squad_data')
                        .upsert({ id: 'main_config', content: currentContent });
                } catch (err) {
                    console.log("Lỗi lưu cloud:", err);
                }
            }
        }

        function renderRightHistory() {
            const container = document.getElementById('rightHistoryList');
            container.innerHTML = '';

            let historyItems = [];
            membersList.forEach(m => {
                const state = checkedState[m.name];
                if (state) {
                    matchTypes.forEach(type => {
                        if (state[type.key]) {
                            historyItems.push({ name: m.name, classType: m.classType, type: type.label });
                        }
                    });
                }
            });

            document.getElementById('rightTitle').innerText = `LỊCH SỬ TRÚNG THƯỞNG ( ${historyItems.length} )`;

            if (historyItems.length === 0) {
                container.innerHTML = '<div class="empty-history">Chưa có dữ liệu. Hãy tích chọn ở bên trái.</div>';
                return;
            }

            historyItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <div class="member-info-left">
                        <span class="member-name">${item.name}</span>
                        <span class="member-class-tag class-${item.classType}">
                            ${getIconHTML(item.classType)} ${classNamesMap[item.classType]}
                        </span>
                    </div>
                    <span style="font-size: 12px; color: #58a6ff; font-weight: bold;">[${item.type}]</span>
                `;
                container.appendChild(card);
            });
        }

        async function clearHistory() {
            if (confirm("Bạn có chắc chắn muốn xóa hết các tích chọn lịch sử không?")) {
                checkedState = {};
                renderAll();

                if (supabaseClient) {
                    try {
                        let { data } = await supabaseClient
                            .from('squad_data')
                            .select('*')
                            .eq('id', 'main_config')
                            .maybeSingle();

                        let currentContent = data && data.content ? data.content : {};
                        currentContent.gaCheckedState = checkedState;

                        await supabaseClient
                            .from('squad_data')
                            .upsert({ id: 'main_config', content: currentContent });
                        
                        alert("🗑️ Đã xóa và cập nhật lên Cloud thành công!");
                    } catch (err) {
                        console.log("Lỗi xóa cloud:", err);
                    }
                }
            }
        }

        function exportExcel() {
            alert("Tính năng xuất Excel đang được tích hợp!");
        }

        // Tải trước thư viện Supabase ngầm để sẵn sàng xử lý sau khi đăng nhập
        const script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
        document.head.appendChild(script);
    </script>
</body>
</html>
