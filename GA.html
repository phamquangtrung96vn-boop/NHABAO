<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Sách GA & Thành Viên Bang</title>
    
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Thư viện SheetJS (XLSX) để xuất file Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 15px;
        }

        /* KHUNG LOGIN OVERLAY (CHỈ HIỆN KHI CHƯA ĐĂNG NHẬP) */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            background-image: linear-gradient(rgba(5, 10, 8, 0.75), rgba(5, 10, 8, 0.9)), 
                              url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-container {
            position: relative;
            width: 380px;
            margin-top: 40px;
        }

        .badge-image-container {
            position: absolute;
            top: -65px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: #0f1115;
            border-radius: 50%;
            border: 3px solid #238636;
            box-shadow: 0 0 20px rgba(35, 134, 54, 0.9);
            overflow: hidden;
        }

        .badge-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .login-box {
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid #238636;
            padding: 60px 30px 25px 30px;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(35, 134, 54, 0.3);
        }

        .login-box h2 {
            margin: 0 0 5px 0;
            font-size: 18px;
            text-align: center;
            color: #2ea043;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(46, 160, 67, 0.4);
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #2ea043;
            font-size: 12px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .input-group input:focus {
            border-color: #2ea043;
            box-shadow: 0 0 5px rgba(35, 134, 54, 0.5);
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: linear-gradient(to bottom, #238636, #196127);
            border: 1px solid #2ea043;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(35, 134, 54, 0.4);
            transition: 0.2s;
        }

        button[type="submit"]:hover {
            background: linear-gradient(to bottom, #2ea043, #238636);
        }

        .error {
            color: #f85149;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }

        /* GIAO DIỆN CHÍNH */
        .header-banner {
            background: #161b22;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-back {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-back:hover { background: #30363d; color: #fff; }

        .main-layout {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 15px;
            height: calc(100vh - 90px);
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-title {
            color: #58a6ff;
            margin-bottom: 12px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .filter-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .filter-row {
            display: flex;
            gap: 8px;
        }

        .search-input, .filter-select {
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .search-input { flex: 1; }
        .filter-select { width: 100%; }
        .search-input:focus, .filter-select:focus { outline: none; border-color: #58a6ff; }

        /* KHU VỰC CHỌN TẤT CẢ THEO CỘT */
        .select-all-bar {
            background: #1f242c;
            border: 1px dashed var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #58a6ff;
            margin-bottom: 8px;
        }

        .select-all-group {
            display: flex;
            gap: 12px;
        }

        .member-scroll-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .member-card {
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .member-info-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 120px;
        }

        .member-name { font-weight: bold; color: #fff; }

        .member-class-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            width: fit-content;
            font-weight: 600;
        }

        .member-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            max-width: 270px;
            justify-content: flex-end;
        }

        .checkbox-group {
            display: flex;
            gap: 4px;
            font-size: 11px;
            align-items: center;
            cursor: pointer;
            color: #c9d1d9;
            width: 58px;
        }

        .checkbox-group input {
            accent-color: #238636;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .right-toolbar { display: flex; gap: 6px; }

        .btn-mini {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-mini.success { color: #3fb950; border-color: rgba(63, 185, 80, 0.4); }
        .btn-mini.success:hover { background: #238636; color: #fff; }
        .btn-mini.danger { color: #f85149; border-color: rgba(248,81,73,0.4); }
        .btn-mini:hover { background: #30363d; }

        .history-content {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-history {
            color: #8b949e;
            font-style: italic;
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
        }

        /* Màu sắc hệ phái chuẩn */
        .class-ThietY    { background-color: #facc15 !important; color: #111; }
        .class-HuyetHa   { background-color: #dc2626 !important; color: #fff; }
        .class-ToaiMong  { background-color: #7dd3fc !important; color: #111; }
        .class-ThanTuang { background-color: #1d4ed8 !important; color: #fff; }
        .class-CuuLinh   { background-color: #831843 !important; color: #fff; }
        .class-ToVan     { background-color: #ec4899 !important; color: #fff; }
        .class-LongNgam  { background-color: #166534 !important; color: #fff; }
        .class-HuyenCo   { background-color: #475569 !important; color: #fff; }
        .class-TrieuQuang{ background-color: #0284c7 !important; color: #fff; }

        .custom-spear-icon {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: middle;
            background-color: currentColor;
            -webkit-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 250"><path d="M50 0 L85 45 L70 105 L60 115 L60 215 L70 225 L50 250 L30 225 L40 215 L40 115 L30 105 L15 45 Z M50 20 L35 55 L50 95 L65 55 Z"/></svg>') no-repeat center / contain;
            mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 250"><path d="M50 0 L85 45 L70 105 L60 115 L60 215 L70 225 L50 250 L30 225 L40 215 L40 115 L30 105 L15 45 Z M50 20 L35 55 L50 95 L65 55 Z"/></svg>') no-repeat center / contain;
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP DỰ PHÒNG -->
    <div id="loginOverlay">
        <div class="login-container">
            <div class="badge-image-container">
                <img src="dragon.png" alt="Biểu Tượng Rồng Xanh">
            </div>

            <div class="login-box">
                <h2>Đăng Nhập Bang Chiến</h2>
                <div class="subtitle">Dragon's Legacy - Liên Đoàn Nhà Báo</div>
                
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <label for="username">Tài Khoản / Email</label>
                        <input type="text" id="username" placeholder="Nhập danh tính của bạn..." required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Mật Khẩu</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit">Vào Trận Chiến</button>
                    <div id="errorMsg" class="error"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- NỘI DUNG QUẢN LÝ GA -->
    <div class="header-banner">
        <span><i class="fa-solid fa-users-gear"></i> QUẢN LÝ DANH SÁCH GA & THÀNH VIÊN BANG</span>
        <a href="index.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Về Sơ Đồ</a>
    </div>

    <div class="main-layout">
        <div class="panel">
            <div class="panel-title">
                <span id="leftTitle">THÀNH VIÊN BANG ( 0 )</span>
            </div>
            
            <div class="filter-container">
                <div class="filter-row">
                    <input type="text" class="search-input" id="searchInput" placeholder="Tìm kiếm tên thành viên..." oninput="filterMembers()">
                    <select class="filter-select" id="classFilter" style="width: 150px;" onchange="filterMembers()">
                        <option value="">Tất cả môn phái</option>
                        <option value="ThietY">Thiết Y</option>
                        <option value="HuyetHa">Huyết Hà</option>
                        <option value="ToaiMong">Toái Mộng</option>
                        <option value="ThanTuang">Thần Tương</option>
                        <option value="ToVan">Tố Vấn</option>
                        <option value="CuuLinh">Cửu Linh</option>
                        <option value="LongNgam">Long Ngâm</option>
                        <option value="HuyenCo">Huyền Cơ</option>
                        <option value="TrieuQuang">Triều Quang</option>
                    </select>
                </div>
                
                <!-- THANH CHỌN TẤT CẢ THEO KẾT QUẢ LỌC -->
                <div class="select-all-bar">
                    <span><i class="fa-solid fa-check-double"></i> Chọn nhanh theo lọc:</span>
                    <div class="select-all-group">
                        <label class="checkbox-group" title="Chọn tất cả Scrim 1 cho danh sách đang lọc">
                            <input type="checkbox" id="checkAll_scrim1" onchange="toggleSelectAllColumn('scrim1', this.checked)"> S1
                        </label>
                        <label class="checkbox-group" title="Chọn tất cả Scrim 2 cho danh sách đang lọc">
                            <input type="checkbox" id="checkAll_scrim2" onchange="toggleSelectAllColumn('scrim2', this.checked)"> S2
                        </label>
                        <label class="checkbox-group" title="Chọn tất cả Scrim 3 cho danh sách đang lọc">
                            <input type="checkbox" id="checkAll_scrim3" onchange="toggleSelectAllColumn('scrim3', this.checked)"> S3
                        </label>
                        <label class="checkbox-group" title="Chọn tất cả Bang Chiến cho danh sách đang lọc">
                            <input type="checkbox" id="checkAll_bc" onchange="toggleSelectAllColumn('bc', this.checked)"> BC
                        </label>
                    </div>
                </div>
            </div>

            <div class="member-scroll-list" id="leftMemberList">
                <div class="empty-history">Đang đồng bộ dữ liệu từ Cloud...</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">
                <span id="rightTitle">DANH SÁCH THAM GIA GA ( 0 )</span>
                <div class="right-toolbar">
                    <button class="btn-mini success" onclick="manualSaveToCloud()"><i class="fa-solid fa-cloud-arrow-up"></i> Lưu Cloud</button>
                    <button class="btn-mini" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
                    <button class="btn-mini danger" onclick="clearHistory()"><i class="fa-solid fa-trash"></i> Xóa Hết</button>
                </div>
            </div>
            <div class="history-content" id="rightHistoryList">
                <div class="empty-history">Chưa có dữ liệu.</div>
            </div>
        </div>
    </div>

    <script>
        const classIcons = {
            ThietY: "fa-solid fa-hand-fist",
            HuyetHa: "custom-spear-icon",
            ToaiMong: "fa-solid fa-burst",
            ThanTuang: "fa-solid fa-guitar",
            ToVan: "fa-solid fa-heart-pulse",
            CuuLinh: "fa-solid fa-skull",
            LongNgam: "fa-solid fa-bolt",
            HuyenCo: "fa-solid fa-gear",
            TrieuQuang: "fa-solid fa-droplet"
        };

        const classNamesMap = {
            ThietY: "Thiết Y",
            HuyetHa: "Huyết Hà",
            ToaiMong: "Toái Mộng",
            ThanTuang: "Thần Tương",
            ToVan: "Tố Vấn",
            CuuLinh: "Cửu Linh",
            LongNgam: "Long Ngâm",
            HuyenCo: "Huyền Cơ",
            TrieuQuang: "Triều Quang"
        };

        function getIconHTML(classType) {
            if (classType === 'HuyetHa') {
                return `<i class="custom-spear-icon"></i>`;
            }
            return `<i class="${classIcons[classType] || 'fa-solid fa-user'}"></i>`;
        }

        let membersList = [];
        let checkedState = {}; 
        let currentFilteredList = []; 
        let supabaseClient = null;

        const matchTypes = [
            { key: 'scrim1', label: 'S1' },
            { key: 'scrim2', label: 'S2' },
            { key: 'scrim3', label: 'S3' },
            { key: 'bc', label: 'BC' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = sessionStorage.getItem("isLoggedIn");
            if (isLoggedIn === "true") {
                document.getElementById('loginOverlay').style.display = 'none';
                loadSupabaseAndInit();
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            const correctUser = "nhabao";
            const correctPass = "Pk123456*";

            if (user === correctUser && pass === correctPass) {
                sessionStorage.setItem("isLoggedIn", "true");
                document.getElementById('loginOverlay').style.display = 'none';
                loadSupabaseAndInit();
            } else {
                document.getElementById('errorMsg').innerText = "Sai tài khoản hoặc mật khẩu!";
            }
        }

        function loadSupabaseAndInit() {
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
            script.onload = initApp;
            document.head.appendChild(script);
        }

        async function initApp() {
            const localState = localStorage.getItem('gaCheckedState');
            if (localState) {
                try {
                    checkedState = JSON.parse(localState);
                } catch (e) {
                    console.log("Lỗi đọc localStorage", e);
                }
            }

            try {
                const SUPABASE_URL = 'https://shblqenkrzjuklzrvoie.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYmxxZW5rcnpqdWtsenJ2b2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4MjMsImV4cCI6MjEwNDU0NjgyM30.I8bsjcbR3dNYm99kHan8mLj9X7jcNuPEzFQTk9jUups';
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                let { data, error } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'main_config')
                    .maybeSingle();

                if (data && data.content) {
                    if (data.content.members) {
                        membersList = data.content.members.filter(m => m.classType && m.classType !== 'Khac');
                        membersList.sort((a, b) => a.classType.localeCompare(b.classType));
                    }
                    if (data.content.gaCheckedState) {
                        checkedState = data.content.gaCheckedState;
                        localStorage.setItem('gaCheckedState', JSON.stringify(checkedState));
                    }
                }
            } catch (err) {
                console.log("Lỗi đồng bộ cloud:", err);
            }

            renderAll();
        }

        function renderAll() {
            filterMembers();
            renderRightHistory();
        }

        function filterMembers() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const selectedClass = document.getElementById('classFilter').value;

            currentFilteredList = membersList.filter(m => {
                const matchName = m.name.toLowerCase().includes(keyword);
                const matchClass = selectedClass === "" || m.classType === selectedClass;
                return matchName && matchClass;
            });

            renderLeftList(currentFilteredList);
            updateSelectAllCheckboxesState();
        }

        function renderLeftList(list) {
            const container = document.getElementById('leftMemberList');
            container.innerHTML = '';
            document.getElementById('leftTitle').innerText = `THÀNH VIÊN BANG ( ${list.length} )`;

            if (!list || list.length === 0) {
                container.innerHTML = '<div class="empty-history">Không tìm thấy thành viên phù hợp.</div>';
                return;
            }

            list.forEach(m => {
                const classType = m.classType;
                const name = m.name;
                if (!checkedState[name]) checkedState[name] = {};

                let checkboxesHTML = '';
                matchTypes.forEach(type => {
                    const isChecked = !!checkedState[name][type.key];
                    checkboxesHTML += `
                        <label class="checkbox-group">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleScrim('${name}', '${type.key}', this.checked)"> ${type.label}
                        </label>
                    `;
                });

                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <div class="member-info-left">
                        <span class="member-name">${name}</span>
                        <span class="member-class-tag class-${classType}">
                            ${getIconHTML(classType)} ${classNamesMap[classType]}
                        </span>
                    </div>
                    <div class="member-actions">
                        ${checkboxesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleSelectAllColumn(scrimType, isChecked) {
            if (currentFilteredList.length === 0) return;

            currentFilteredList.forEach(m => {
                if (!checkedState[m.name]) {
                    checkedState[m.name] = {};
                }
                checkedState[m.name][scrimType] = isChecked;
            });

            renderLeftList(currentFilteredList);
            renderRightHistory();
            autoSaveLocal();
        }

        function updateSelectAllCheckboxesState() {
            matchTypes.forEach(type => {
                const checkbox = document.getElementById(`checkAll_${type.key}`);
                if (!checkbox) return;

                if (currentFilteredList.length === 0) {
                    checkbox.checked = false;
                    checkbox.indeterminate = false;
                    return;
                }

                const checkedCount = currentFilteredList.filter(m => checkedState[m.name] && checkedState[m.name][type.key]).length;

                if (checkedCount === currentFilteredList.length) {
                    checkbox.checked = true;
                    checkbox.indeterminate = false;
                } else if (checkedCount > 0) {
                    checkbox.checked = false;
                    checkbox.indeterminate = true;
                } else {
                    checkbox.checked = false;
                    checkbox.indeterminate = false;
                }
            });
        }

        async function toggleScrim(name, scrimType, isChecked) {
            if (!checkedState[name]) {
                checkedState[name] = {};
            }
            checkedState[name][scrimType] = isChecked;
            
            renderRightHistory();
            updateSelectAllCheckboxesState();
            autoSaveLocal();
        }

        function autoSaveLocal() {
            localStorage.setItem('gaCheckedState', JSON.stringify(checkedState));
        }

        async function manualSaveToCloud() {
            autoSaveLocal();
            if (!supabaseClient) {
                alert("⚠️ Chưa kết nối được tới Supabase!");
                return;
            }

            try {
                let { data, error: fetchError } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'main_config')
                    .maybeSingle();

                let currentContent = data && data.content ? data.content : {};
                currentContent.gaCheckedState = checkedState;

                let { error: upsertError } = await supabaseClient
                    .from('squad_data')
                    .upsert({ id: 'main_config', content: currentContent });

                if (upsertError) {
                    console.error("Supabase error:", upsertError);
                    alert("❌ Lỗi khi lưu lên Cloud: " + upsertError.message);
                } else {
                    alert("☁️ Lưu lên Cloud thành công! Dữ liệu đã an toàn tuyệt đối.");
                }
            } catch (err) {
                console.error("Lỗi:", err);
                alert("❌ Có lỗi xảy ra khi lưu: " + err.message);
            }
        }

        function renderRightHistory() {
            const container = document.getElementById('rightHistoryList');
            container.innerHTML = '';

            const fullMatchLabelMap = {
                scrim1: 'Scrim 1',
                scrim2: 'Scrim 2',
                scrim3: 'Scrim 3',
                bc: 'Bang Chiến'
            };

            let historyItems = [];
            membersList.forEach(m => {
                const state = checkedState[m.name];
                if (state) {
                    Object.keys(fullMatchLabelMap).forEach(key => {
                        if (state[key]) {
                            historyItems.push({ name: m.name, classType: m.classType, type: fullMatchLabelMap[key] });
                        }
                    });
                }
            });

            document.getElementById('rightTitle').innerText = `DANH SÁCH THAM GIA GA ( ${historyItems.length} )`;

            if (historyItems.length === 0) {
                container.innerHTML = '<div class="empty-history">Chưa có dữ liệu. Hãy tích chọn ở bên trái.</div>';
                return;
            }

            historyItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <div class="member-info-left">
                        <span class="member-name">${item.name}</span>
                        <span class="member-class-tag class-${item.classType}">
                            ${getIconHTML(item.classType)} ${classNamesMap[item.classType]}
                        </span>
                    </div>
                    <span style="font-size: 12px; color: #58a6ff; font-weight: bold;">[${item.type}]</span>
                `;
                container.appendChild(card);
            });
        }

        async function clearHistory() {
            if (confirm("Bạn có chắc chắn muốn xóa hết các tích chọn không?")) {
                checkedState = {};
                localStorage.removeItem('gaCheckedState');
                renderAll();
                manualSaveToCloud();
            }
        }

        function exportExcel() {
            const fullMatchLabelMap = {
                scrim1: 'Scrim 1',
                scrim2: 'Scrim 2',
                scrim3: 'Scrim 3',
                bc: 'Bang Chiến'
            };

            let historyItems = [];
            membersList.forEach(m => {
                const state = checkedState[m.name];
                if (state) {
                    Object.keys(fullMatchLabelMap).forEach(key => {
                        if (state[key]) {
                            historyItems.push({
                                "Tên Thành Viên": m.name,
                                "Môn Phái": classNamesMap[m.classType] || m.classType,
                                "Loại Sự Kiện / Trận": fullMatchLabelMap[key]
                            });
                        }
                    });
                }
            });

            if (historyItems.length === 0) {
                alert("⚠️ Không có dữ liệu để xuất Excel!");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(historyItems);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "DanhSachGA");

            XLSX.writeFile(workbook, "DanhSach_ThamGia_GA.xlsx");
        }
    </script>
