<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Sách GA & Thành Viên Bang</title>

    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 20px;
        }

        .title-banner {
            background: linear-gradient(90deg, #161b22, #21262d);
            color: #f0f6fc;
            padding: 12px 20px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .action-btn:hover { background: #30363d; color: #fff; }

        .btn-cloud { background: #238636; color: white; border: none; }
        .btn-cloud:hover { background: #2ea043; }

        .btn-logout { background: #da3633; color: white; border: none; }
        .btn-logout:hover { background: #f85149; }

        .main-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .search-box input {
            width: 300px;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .toolbar-right {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: calc(100vh - 250px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-item {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-name {
            font-weight: bold;
            color: #f0f6fc;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-role {
            font-size: 11px;
            background: #21262d;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            color: #8b949e;
        }

        .ga-checks {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .ga-checks label {
            font-size: 12px;
            color: #8b949e;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .ga-checks input[type="checkbox"] {
            accent-color: #238636;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .empty-msg {
            text-align: center;
            color: #8b949e;
            padding: 30px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- KIỂM TRA BẢO MẬT ĐĂNG NHẬP -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (!isLoggedIn) {
                window.location.href = 'login.html';
            }
        });

        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userRole');
            window.location.href = 'login.html';
        }
    </script>

    <div class="title-banner">
        <span><i class="fa-solid fa-clipboard-check"></i> Quản Lý Danh Sách GA & Thành Viên Bang</span>
        <div class="nav-buttons">
            <a href="transit.html" class="action-btn"><i class="fa-solid fa-shuffle"></i> Trang Transit</a>
            <a href="index.html" class="action-btn"><i class="fa-solid fa-arrow-left"></i> Về Đội Hình</a>
            <button onclick="saveToCloud()" class="action-btn btn-cloud"><i class="fa-solid fa-cloud-arrow-up"></i> Lưu Cloud</button>
            <button onclick="logout()" class="action-btn btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất</button>
        </div>
    </div>

    <div class="main-container">
        <div class="controls-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm kiếm tên thành viên..." oninput="renderMemberList()">
            </div>
            <div class="toolbar-right">
                <span id="memberCount" style="font-size: 13px; color: #8b949e; font-weight: bold;">Tổng số: 0 thành viên</span>
            </div>
        </div>

        <div class="member-list" id="memberListContainer">
            <!-- Danh sách thành viên sẽ được render tự động -->
        </div>
    </div>

    <script>
        // Cấu hình Supabase (giữ đồng bộ với các trang khác)
        const SUPABASE_URL = 'https://shblqenkrzjuklzrvoie.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYmxxZW5rcnpqdWtsenJ2b2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4MjMsImV4cCI6MjEwNDU0NjgyM30.I8bsjcbR3dNYm99kHan8mLj9X7jcNuPEzFQTk9jUups'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let membersData = [];
        let gaStatusData = {}; // Lưu trạng thái check GA theo id thành viên

        async function initGA() {
            await loadDataFromCloud();
        }

        async function loadDataFromCloud() {
            try {
                // Tải danh sách thành viên từ squad_data và trạng thái GA từ ga_data (hoặc squad_data)
                let { data, error } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'main_config')
                    .maybeSingle();

                if (data && data.content) {
                    // Lấy danh sách thành viên từ cấu hình đội hình nếu có
                    membersData = data.content.members || [
                        { id: 1, name: "Garo", role: "Thiết Y" },
                        { id: 2, name: "Minh Sói Trần", role: "Thiết Y" },
                        { id: 3, name: "Độc Tại Tâm", role: "Thiết Y" },
                        { id: 4, name: "UHuyen", role: "Thiết Y" },
                        { id: 5, name: "Kame", role: "Thiết Y" },
                        { id: 6, name: "Ne Bồ Nông", role: "Thiết Y" }
                    ];
                } else {
                    membersData = [
                        { id: 1, name: "Garo", role: "Thiết Y" },
                        { id: 2, name: "Minh Sói Trần", role: "Thiết Y" },
                        { id: 3, name: "Độc Tại Tâm", role: "Thiết Y" }
                    ];
                }

                // Tải trạng thái GA đã lưu
                let { data: gaData, error: gaError } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'ga_config')
                    .maybeSingle();

                if (gaData && gaData.content) {
                    gaStatusData = gaData.content.gaStatus || {};
                }

                renderMemberList();
            } catch (err) {
                console.log("Lỗi tải dữ liệu:", err);
            }
        }

        async function saveToCloud() {
            try {
                const payload = { gaStatus: gaStatusData };
                let { error } = await supabaseClient
                    .from('squad_data')
                    .upsert({ id: 'ga_config', content: payload });

                if (error) {
                    alert("Lỗi khi lưu lên Cloud: " + error.message);
                } else {
                    alert("Đã lưu dữ liệu GA lên Cloud thành công!");
                }
            } catch (err) {
                alert("Lỗi kết nối khi lưu!");
            }
        }

        function updateGAStatus(memberId, field, isChecked) {
            if (!gaStatusData[memberId]) {
                gaStatusData[memberId] = { s1: false, s2: false, s3: false, bc: false };
            }
            gaStatusData[memberId][field] = isChecked;
        }

        function renderMemberList() {
            const container = document.getElementById('memberListContainer');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = membersData.filter(m => m.name.toLowerCase().includes(keyword));
            document.getElementById('memberCount').innerText = `Tổng số: ${filtered.length} thành viên`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-msg">Không tìm thấy thành viên phù hợp.</div>`;
                return;
            }

            filtered.forEach(m => {
                const status = gaStatusData[m.id] || { s1: false, s2: false, s3: false, bc: false };

                const div = document.createElement('div');
                div.className = 'member-item';
                div.innerHTML = `
                    <div class="member-name">
                        <span>${m.name}</span>
                        <span class="member-role"><i class="fa-solid fa-shield"></i> ${m.role || 'Thành viên'}</span>
                    </div>
                    <div class="ga-checks">
                        <label><input type="checkbox" ${status.s1 ? 'checked' : ''} onchange="updateGAStatus(${m.id}, 's1', this.checked)"> S1</label>
                        <label><input type="checkbox" ${status.s2 ? 'checked' : ''} onchange="updateGAStatus(${m.id}, 's2', this.checked)"> S2</label>
                        <label><input type="checkbox" ${status.s3 ? 'checked' : ''} onchange="updateGAStatus(${m.id}, 's3', this.checked)"> S3</label>
                        <label><input type="checkbox" ${status.bc ? 'checked' : ''} onchange="updateGAStatus(${m.id}, 'bc', this.checked)"> BC</label>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        initGA();
    </script>
</body>
</html>
