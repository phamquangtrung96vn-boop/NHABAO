<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý POV Bang Chiến - Nghịch Thủy Hàn</title>
    
    <!-- ĐOẠN CODE BẢO VỆ TRANG (KIỂM TRA ĐĂNG NHẬP) -->
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>

    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            padding: 20px;
        }

        .title-banner {
            background: linear-gradient(90deg, #161b22, #21262d);
            color: #f0f6fc;
            padding: 12px 20px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .back-btn:hover { background: #30363d; color: #fff; }

        .main-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
        }

        @media(max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        .form-card, .list-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }

        .form-card h3, .list-card h3 {
            color: #58a6ff;
            font-size: 15px;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #8b949e;
            text-transform: uppercase;
        }

        .input-group input, .input-group select {
            padding: 8px 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            outline: none;
            font-size: 13px;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #58a6ff;
        }

        .btn-submit {
            background: #238636;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
            transition: 0.2s;
        }
        .btn-submit:hover { background: #2ea043; }

        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 12px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }

        .pov-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .pov-item {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .pov-item:hover { border-color: #484f58; }

        .pov-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .pov-meta {
            display: flex;
            gap: 10px;
            font-size: 11px;
            color: #8b949e;
            align-items: center;
        }

        .badge-match {
            background: #1f6beb;
            color: #fff;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .pov-teams {
            font-size: 14px;
            font-weight: bold;
            color: #f0f6fc;
        }

        .pov-winner {
            font-size: 12px;
            color: #3fb950;
            font-weight: 600;
        }

        .pov-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-youtube {
            background: #da3633;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }
        .btn-youtube:hover { background: #f85149; }

        .btn-delete {
            background: transparent;
            color: #8b949e;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: 0.2s;
        }
        .btn-delete:hover { color: #f85149; }

        .empty-msg {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="title-banner">
        <span><i class="fa-solid fa-video"></i> Quản Lý POV Bang Chiến</span>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Về Sơ Đồ</a>
    </div>

    <div class="main-container">
        <!-- CỘT TRÁI: THÊM TRẬN ĐẤU MỚI -->
        <div class="form-card">
            <h3><i class="fa-solid fa-plus-circle"></i> Thêm Trận Đấu Mới</h3>
            <div class="input-group">
                <label>Ngày Tháng Năm:</label>
                <input type="date" id="matchDate">
            </div>
            <div class="input-group">
                <label>Trận Mấy:</label>
                <select id="matchRound">
                    <option value="Trận 1">Trận 1</option>
                    <option value="Trận 2">Trận 2</option>
                    <option value="Trận 3">Trận 3</option>
                    <option value="Trận Giao Lưu">Trận Giao Lưu</option>
                </select>
            </div>
            <div class="input-group">
                <label>Bang Hội 1 (Chủ Nhà):</label>
                <input type="text" id="clan1Input" value="Nhà Báo">
            </div>
            <div class="input-group">
                <label>Bang Hội 2 (Đối Thủ):</label>
                <input type="text" id="clan2Input" placeholder="Ví dụ: VSKP">
            </div>
            <div class="input-group">
                <label>Bên Nào Win:</label>
                <select id="winnerSelect">
                    <option value="Bang 1 Win">Nhà Báo Win 🏆</option>
                    <option value="Bang 2 Win">Đối Thủ Win 🏆</option>
                </select>
            </div>
            <div class="input-group">
                <label>Link YouTube Trận Đấu:</label>
                <input type="text" id="youtubeLinkInput" placeholder="Dán link YouTube vào đây">
            </div>
            <button class="btn-submit" onclick="addPovMatch()"><i class="fa-solid fa-check"></i> Thêm Vào Danh Sách</button>
        </div>

        <!-- CỘT PHẢI: DANH SÁCH TRẬN ĐẤU -->
        <div class="list-card">
            <h3><i class="fa-solid fa-list"></i> Danh Sách Bang Chiến</h3>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên bang, trận..." oninput="renderPovList()">
            </div>
            <div class="pov-list" id="povListContainer">
                <!-- Danh sách sẽ được render tự động qua JavaScript -->
            </div>
        </div>
    </div>

    <script>
        // KẾT NỐI SUPABASE CHUNG CÙNG HỆ THỐNG
        const SUPABASE_URL = 'https://shblqenkrzjuklzrvoie.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYmxxZW5rcnpqdWtsenJ2b2llIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzA4MjMsImV4cCI6MjEwNDU0NjgyM30.I8bsjcbR3dNYm99kHan8mLj9X7jcNuPEzFQTk9jUups'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let povList = [];

        // Khởi tạo ngày mặc định là hôm nay
        document.getElementById('matchDate').valueAsDate = new Date();

        async function initPOV() {
            await loadPOVFromCloud();
        }

        // Tải dữ liệu từ Cloud lên mọi máy tính
        async function loadPOVFromCloud() {
            try {
                let { data, error } = await supabaseClient
                    .from('squad_data')
                    .select('*')
                    .eq('id', 'pov_config')
                    .maybeSingle();

                if (data && data.content && data.content.povList) {
                    povList = data.content.povList;
                } else {
                    povList = [];
                }
                renderPovList();
            } catch (err) {
                console.log("Lỗi tải dữ liệu POV từ cloud:", err);
            }
        }

        // Lưu dữ liệu lên Cloud
        async function savePOVToCloud() {
            const payload = { povList: povList };
            await supabaseClient
                .from('squad_data')
                .upsert({ id: 'pov_config', content: payload });
        }

        // Thêm trận đấu mới
        async function addPovMatch() {
            const date = document.getElementById('matchDate').value;
            const round = document.getElementById('matchRound').value;
            const clan1 = document.getElementById('clan1Input').value.trim();
            const clan2 = document.getElementById('clan2Input').value.trim();
            const winner = document.getElementById('winnerSelect').value;
            const link = document.getElementById('youtubeLinkInput').value.trim();

            if (!clan2) {
                alert("Vui lòng nhập tên Bang hội đối thủ!");
                return;
            }
            if (!link) {
                alert("Vui lòng nhập link YouTube trận đấu!");
                return;
            }

            const newMatch = {
                id: Date.now(),
                date: date,
                round: round,
                clan1: clan1,
                clan2: clan2,
                winner: winner,
                link: link
            };

            povList.unshift(newMatch); // Đưa lên đầu danh sách
            await savePOVToCloud();
            renderPovList();

            // Reset form input link và đối thủ
            document.getElementById('clan2Input').value = '';
            document.getElementById('youtubeLinkInput').value = '';
        }

        // Xóa trận đấu
        async function deletePovMatch(id) {
            if (confirm("Bạn có chắc chắn muốn xóa trận đấu này không?")) {
                povList = povList.filter(item => item.id !== id);
                await savePOVToCloud();
                renderPovList();
            }
        }

        // Hiển thị danh sách ra giao diện
        function renderPovList() {
            const container = document.getElementById('povListContainer');
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filteredList = povList.filter(item => 
                item.clan1.toLowerCase().includes(keyword) ||
                item.clan2.toLowerCase().includes(keyword) ||
                item.round.toLowerCase().includes(keyword) ||
                item.date.includes(keyword)
            );

            if (filteredList.length === 0) {
                container.innerHTML = `<div class="empty-msg">Chưa có trận đấu nào được lưu trữ.</div>`;
                return;
            }

            filteredList.forEach(item => {
                const winnerText = item.winner === 'Bang 1 Win' ? `${item.clan1} WIN 🏆` : `${item.clan2} WIN 🏆`;
                
                const div = document.createElement('div');
                div.className = 'pov-item';
                div.innerHTML = `
                    <div class="pov-info">
                        <div class="pov-meta">
                            <span><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                            <span class="badge-match">${item.round}</span>
                        </div>
                        <div class="pov-teams">${item.clan1} <span style="color:#8b949e; font-weight:normal;">VS</span> ${item.clan2}</div>
                        <div class="pov-winner">${winnerText}</div>
                    </div>
                    <div class="pov-actions">
                        <a href="${item.link}" target="_blank" class="btn-youtube"><i class="fa-brands fa-youtube"></i> Xem YouTube</a>
                        <button class="btn-delete" onclick="deletePovMatch(${item.id})" title="Xóa trận"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // Chạy khởi tạo tải dữ liệu khi vừa mở trang
        initPOV();
    </script>
</body>
</html>
